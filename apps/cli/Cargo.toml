[package]
name = "a"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rt.workspace = true
client.workspace = true
engine.workspace = true
ext.workspace = true
ext-metrics.workspace = true
# The extensions: see `exts`. Each is a feature, every one on but the
# fixtures, which are empty unless turned on.
ext-compact = { workspace = true, optional = true }
ext-edit = { workspace = true, optional = true }
ext-fixtures.workspace = true
ext-mcp = { workspace = true, optional = true }
ext-fork = { workspace = true, optional = true }
ext-index = { workspace = true, optional = true }
ext-search = { workspace = true, optional = true }
ext-lua = { workspace = true, optional = true }
ext-policy = { workspace = true, optional = true }
ext-prompt = { workspace = true, optional = true }
ext-retry = { workspace = true, optional = true }
ext-settings = { workspace = true, optional = true }
ext-skills = { workspace = true, optional = true }
ext-shell = { workspace = true, optional = true }
ext-spill = { workspace = true, optional = true }
ext-subagent = { workspace = true, optional = true }
ext-title = { workspace = true, optional = true }
protocol.workspace = true
sys.workspace = true
serde_json.workspace = true
tui.workspace = true
usage-rs.workspace = true
web = { workspace = true, optional = true }

[features]
default = ["mcp", "fork", "web", "policy", "prompt", "shell", "edit", "compact", "retry", "settings", "spill", "subagent", "title", "skills", "index", "search"]
# User mods; opt-in until quiet-machine startup has been verified.
lua = ["dep:ext-lua"]
fork = ["dep:ext-fork"]
# Lazy Model Context Protocol servers.
mcp = ["shell", "dep:ext-mcp"]
# `a web`; about 110 KiB of the release binary.
web = ["dep:web"]
# Which calls wait for the user's approval.
policy = ["dep:ext-policy"]
# The identity line and the facts the model is first given.
prompt = ["dep:ext-prompt"]
# `bash`, and the working directory and process spawner it provides.
shell = ["dep:ext-shell"]
# `edit`, which needs the working directory the shell provides.
edit = ["shell", "dep:ext-edit"]
# A conversation too large for its model is summarised, and goes on.
compact = ["dep:ext-compact"]
# Model requests that failed for a reason that may pass are sent again.
retry = ["dep:ext-retry"]
# A long tool result is shown as its ends and where the whole is.
spill = ["dep:ext-spill"]
# `/model`, which shows and sets the session's model.
settings = ["dep:ext-settings"]
# Lazily published skill instructions and /name commands.
skills = ["dep:ext-skills"]
# Sessions titled by their model, asked aside.
title = ["dep:ext-title"]
# `task`, which runs a piece of work in a child session.
subagent = ["dep:ext-subagent"]
# One file index per workspace: `files.search` and `files.grep` for clients.
index = ["dep:ext-index"]
# `glob` and `grep` for the model, over the index.
search = ["index", "dep:ext-search"]
# The `echo` agent and `sleep` tool; the tests build them in, as the
# dev-dependency below turns them on.
fixtures = ["ext-fixtures/on"]

# TLS uses the host's crypto library and trust store on every platform.
[dependencies.llm]
workspace = true
features = ["tls-native", "native-buffer"]

[dev-dependencies]
ext = { workspace = true, features = ["testing"] }
sys = { workspace = true, features = ["test-support"] }
tempfile = { version = "3", default-features = false }
ext-mcp = { workspace = true, features = ["fixture"] }
ext-fixtures = { workspace = true, features = ["on"] }

[target.'cfg(unix)'.dev-dependencies]
# A pseudo-terminal for the black-box tests of the terminal client.
rustix = { workspace = true, features = ["pty", "termios"] }
unicode-width = { version = "0.2", default-features = false }
libc.workspace = true

[lints]
workspace = true
