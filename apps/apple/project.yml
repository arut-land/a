# XcodeGen (`mise run apple:gen`) writes A.xcodeproj from this; the project
# is not checked in. Generated/AFfi comes from `mise run apple:ffi`.
name: A
options:
  bundleIdPrefix: dev.a
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  AKit:
    path: AKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Ad hoc for development; releases are signed with a Developer ID.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  A:
    type: application
    platform: macOS
    sources: [App]
    preBuildScripts:
      - name: Bundle the socket activation agent
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          dest="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          mkdir -p "$dest"
          cp "$SRCROOT/LaunchAgents/dev.a.daemon.plist" "$dest/"
    dependencies:
      - package: AKit
    settings:
      base:
        PRODUCT_NAME: A
        PRODUCT_BUNDLE_IDENTIFIER: dev.a.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: a
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Unsandboxed: the daemon it starts runs commands in the user's
        # workspaces.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      # The `a` the app stages and starts the daemon from, and the CLI that
      # "Install Command Line Tool" links (through the staged copy): users
      # never download it separately. A_HELPER names another build; the
      # default is the release build. It runs for every action (build,
      # archive), before Xcode signs the app, which then seals the helper as
      # nested code; it is signed here with the app's identity so both pass
      # `codesign --verify --deep --strict` and notarization.
      - name: Bundle the a helper
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          set -eu
          helper="${A_HELPER:-$SRCROOT/../../target/release/a}"
          if [ ! -x "$helper" ]; then
            echo "error: no a helper at $helper; run cargo build-release -p a" >&2
            exit 1
          fi
          dest="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$dest"
          cp -f "$helper" "$dest/a"
          identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          # A secure timestamp needs a real identity (and the network).
          timestamp=--timestamp=none
          if [ "$identity" != "-" ]; then timestamp=--timestamp; fi
          codesign --force --sign "$identity" --identifier "$PRODUCT_BUNDLE_IDENTIFIER.cli" \
            --options runtime "$timestamp" "$dest/a"
