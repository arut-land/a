[package]
name = "tui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
client.workspace = true
protocol.workspace = true
sys.workspace = true

# The client itself is Unix only, like the daemon (see lib.rs).
[target.'cfg(unix)'.dependencies]
serde.workspace = true
serde_json.workspace = true
unicode-width = { version = "0.2", default-features = false }
# ratatui's core (cell buffer, styles) without widgets or its terminal: the
# client wraps and lays out its own rows and writes the cells that changed.
ratatui-core = { version = "0.1.2", default-features = false, features = ["std"] }
# Input decoding (keys, mouse reports, pastes); `ext-shell` links it already.
vte = { version = "0.15", default-features = false }
# Raw mode, the window size and polling stdin with the signal pipe.
rustix = { workspace = true, features = ["event", "stdio", "termios"] }

[lints]
workspace = true
