[package]
name = "web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
client.workspace = true
protocol.workspace = true
rt.workspace = true
sys.workspace = true
http.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
httparse = { version = "1", default-features = false, features = ["std"] }
http-body-util = "0.1"
# Our own server hosts the render core, so no `serve` feature, but tokio is
# still linked: topcoat-core uses its sync primitives, and topcoat-runtime's
# `router` turns on topcoat-router's `websocket` (hyper, h2, tungstenite)
# for every non-wasm target, with no feature to opt out. The linker keeps
# about 40 KiB of that stack; no tokio runtime is ever started.
topcoat = { version = "=0.10.0", default-features = false, features = ["router", "view", "runtime", "asset"] }

[build-dependencies]
miniz_oxide = "0.8"

[dev-dependencies]
miniz_oxide = "0.8"

[lints]
workspace = true
