[package]
name = "web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
client.workspace = true
protocol.workspace = true
rt.workspace = true
sys.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
httparse = { version = "1", default-features = false, features = ["std"] }
# Type-checked markup (`maud!`, `#[component]`) rendered to strings; its
# macros run at build time only.
hypertext = { version = "0.12.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Inflates the committed script to hold it to the published one.
miniz_oxide = "0.8"

[lints]
workspace = true
