# Replays rig's recorded streaming replies through rig itself and writes the
# normalized result beside each cassette: the parity oracle for crates/llm.
# Run through `mise run fixtures:rig`; never part of the build.
[package]
name = "rig-oracle"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1"
futures-lite = "2"
http = "1"
rig-core = { version = "=0.44.0", default-features = false }
rig-http = { version = "=0.44.0", default-features = false }
serde = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
