[package]
name = "lua-probe"
version = "0.0.0"
edition = "2024"

[workspace]

[features]
lua54 = ["dep:mlua", "mlua/lua54", "mlua/vendored"]
luajit = ["dep:mlua", "mlua/luajit", "mlua/vendored"]
luau = ["dep:mlua", "mlua/luau"]
pure = ["dep:piccolo"]

[dependencies]
mlua = { version = "=0.12.2", optional = true, default-features = false, features = ["send", "async"] }
piccolo = { version = "=0.3.3", optional = true }
ext = { path = "../../../crates/ext" }
llm = { path = "../../../crates/llm" }
protocol = { path = "../../../crates/protocol" }
serde_json = "1"
