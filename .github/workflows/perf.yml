name: Main flakes diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  MISE_AUTO_INSTALL: false
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tgt-main-flakes" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-nextest mold
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends clang pkg-config libssl-dev
      - if: runner.os == 'Windows'
        name: Install native LLVM toolchain
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.*)"').Matches.Groups[1].Value
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $toolchain = "$channel-$arch-pc-windows-msvc"
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
          rustup toolchain install $toolchain --profile minimal --component clippy,rust-src,rustfmt
      - if: runner.os == 'Windows'
        uses: jdx/mise-action@v5
        with:
          install_args: mr-boxington
      - if: runner.os == 'Windows'
        name: Install native nextest
        shell: pwsh
        run: |
          $platform = if ($env:RUNNER_ARCH -eq 'ARM64') { 'windows-arm' } else { 'windows' }
          $archive = "$env:RUNNER_TEMP/nextest.zip"
          Invoke-WebRequest "https://get.nexte.st/0.9.148/$platform" -OutFile $archive
          Expand-Archive $archive -DestinationPath "$env:USERPROFILE/.cargo/bin" -Force
      - if: runner.os == 'Windows'
        name: Select native PowerShell contract runners
        shell: pwsh
        run: |
          $runners = @((Get-Command pwsh.exe).Source, "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe")
          "A_TEST_POWERSHELL=$($runners -join ';')" >> $env:GITHUB_ENV
      - name: Release reproduction
        run: |
          set -o pipefail
          mise exec -- cargo nextest run --release -p ext-mcp --features fixture -p client -p engine -E 'test(timeout_kills_the_request) | test(the_host_list_follows_its_files) | test(retained_request_sources_do_not_pin)' --stress-count 100 --no-fail-fast --status-level all 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(date -u +%FT%TZ)" "$line"; done | tee "$RUNNER_TEMP/probe.log"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: probe-${{ matrix.os }}
          path: ${{ runner.temp }}/probe.log
