name: perf

on:
  push:
    branches: [main, 'perf/**']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      release_overlap:
        description: "Native call-entry overlap probe (reopen or turn; empty disables)"
        default: ''
        type: string
      census_vmmap:
        description: "Add native Microsoft VMMap snapshots to a Windows census"
        default: false
        type: boolean
      residency_cases:
        description: "Optional focused stored:active pairs, e.g. 32:1,32:4"
        default: ''
        type: string
      alloc_census:
        description: "Native census of the selected residency source"
        default: false
        type: boolean
      residency:
        description: "Complete lifecycle ownership waves (five alternating rounds; optional paired_ref)"
        default: false
        type: boolean
      idle_charge:
        description: "Validate native idle charge and a throwaway retained allocation"
        default: false
        type: boolean
      autostart:
        description: 'Run only the hosted autostart probe'
        default: false
        type: boolean
      variant:
        description: 'One variant as JSON: {"rustflags": ["-Ctarget-cpu=x86-64-v2"], "config": ["profile.release.package.serde_json.opt-level=2"]}'
        default: '{}'
        type: string
      runner:
        description: 'Runner label, or all'
        default: all
        type: choice
        options: [all, linux-windows, ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
      harness_ref:
        description: 'Harness revision (empty uses this workflow commit); pin for historical experiments'
        default: ''
        type: string
      source_ref:
        description: 'Source revision (empty uses this workflow revision); main bootstraps a baseline'
        default: ''
        type: string
      bloat:
        description: 'Collect native crate/function size attribution'
        default: false
        type: boolean
      profile:
        description: 'Attribute baseline instructions with Callgrind on Linux x86_64 after timing'
        default: false
        type: boolean
      build_only:
        description: 'Build and inspect a size/linker candidate without runtime measurements'
        default: false
        type: boolean
      paired_ref:
        description: 'Optional reference source revision for interleaved same-runner tuning'
        default: ''
        type: string
      paired_rounds:
        description: 'Alternating reference/candidate rounds'
        default: '5'
        type: string
      ablation:
        description: 'Paired comparison only; skip the separate unpaired suite'
        default: false
        type: boolean
      baseline_run:
        description: 'Optional bootstrap baseline run ID; otherwise latest successful main lane'
        default: ''
        type: string
      sessions:
        description: 'Run only the concurrently active sessions layouts (docs/perf/runtime-demand.md)'
        default: false
        type: boolean
      memory:
        description: 'Only memory survey workloads; skip unrelated benchmark builds'
        default: false
        type: boolean
      survey:
        description: 'Only round-2 CPU, memory and concurrent-session evidence'
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: perf-${{ github.ref }}-${{ inputs.autostart && 'autostart' || 'measure' }}-${{ inputs.runner || 'all' }}-${{ inputs.source_ref || github.sha }}-${{ inputs.paired_ref }}-${{ inputs.build_only }}-${{ inputs.sessions }}-${{ inputs.residency }}-${{ inputs.alloc_census }}-${{ inputs.census_vmmap }}-${{ inputs.release_overlap }}-${{ inputs.variant || '{}' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: false
  # Hosted jobs can use the runner; the shared development host uses two.
  CARGO_BUILD_JOBS: 4

jobs:
  residency:
    if: inputs.residency || inputs.alloc_census || inputs.census_vmmap || inputs.release_overlap
    name: residency (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.release_overlap == 'engine-verify' && 360 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.census_vmmap && inputs.runner == 'all' && '["windows-latest", "windows-11-arm"]' || inputs.alloc_census && inputs.runner == 'all' && '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "windows-11-arm", "macos-latest", "macos-15-intel"]' || inputs.runner == 'linux-windows' && '["ubuntu-latest", "windows-latest"]' || inputs.runner && inputs.runner != 'all' && format('["{0}"]', inputs.runner) || '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "windows-11-arm", "macos-latest", "macos-15-intel"]') }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
      PYTHONDONTWRITEBYTECODE: 1
      MISE_NO_ENV: 1
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_CARGO_BINSTALL_NATIVE: 'true'
      PERF_ALLOC_CENSUS: ${{ inputs.alloc_census || inputs.census_vmmap || false }}
      PERF_RESIDENCY_CASES: ${{ inputs.residency_cases }}
      PERF_PAIRED_ROUNDS: ${{ inputs.paired_rounds || '5' }}
      PERF_RELEASE_OVERLAP: ${{ inputs.release_overlap }}
    steps:
      - name: External build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tgt-native-release" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.harness_ref || github.sha }}
          path: harness
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: measured
      - uses: actions/checkout@v7
        if: inputs.paired_ref != ''
        with:
          ref: ${{ inputs.paired_ref }}
          path: reference
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.2.2
      - name: Select native toolchain
        working-directory: measured
        run: |
          python - <<'PYTHON'
          import os, tomllib
          targets = {
              ('Linux', 'X64'): 'x86_64-unknown-linux-gnu',
              ('Linux', 'ARM64'): 'aarch64-unknown-linux-gnu',
              ('Windows', 'X64'): 'x86_64-pc-windows-msvc',
              ('Windows', 'ARM64'): 'aarch64-pc-windows-msvc',
              ('macOS', 'X64'): 'x86_64-apple-darwin',
              ('macOS', 'ARM64'): 'aarch64-apple-darwin',
          }
          channel = tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel']
          target = targets[os.environ['RUNNER_OS'], os.environ['RUNNER_ARCH']]
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RUSTUP_TOOLCHAIN={channel}-{target}\n')
          PYTHON
      - working-directory: measured
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src --component rustfmt --component clippy
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld mold pkg-config libssl-dev
      - uses: jdx/mise-action@v5
        with:
          working_directory: measured
          install_args: cargo:cargo-nextest@0.9.150 cargo:cargo-nextest@0.9.148
          env: false
      - name: Native Cargo path
        working-directory: measured
        run: echo "$(dirname "$(rustup which cargo)")" >> "$GITHUB_PATH"
      - name: Native VMMap diagnostic tool
        if: inputs.census_vmmap && runner.os == 'Windows'
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, pathlib, urllib.request, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'census-vmmap'
          root.mkdir()
          archive = root / 'VMMap.zip'
          url = 'https://download.sysinternals.com/files/VMMap.zip'
          urllib.request.urlretrieve(url, archive)
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(root)
          name = 'vmmap64a.exe' if os.environ['RUNNER_ARCH'] == 'ARM64' else 'vmmap64.exe'
          executable = next(path for path in root.iterdir() if path.name.lower() == name)
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'residency-output'
          output.mkdir()
          (output / 'vmmap-tool.json').write_text(json.dumps(dict(
              source=url, archive_sha256=hashlib.sha256(archive.read_bytes()).hexdigest(),
              binary=executable.name, sha256=hashlib.sha256(executable.read_bytes()).hexdigest()), indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PERF_VMMAP={executable}\n')
          PYTHON
      - name: Share identical fixture instrumentation between paired sources
        if: inputs.alloc_census || inputs.census_vmmap
        env:
          REFERENCE: ${{ inputs.paired_ref }}
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess
          module = pathlib.Path('measured/crates/sys/src/census.rs').read_bytes()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'residency-output'
          output.mkdir(exist_ok=True)
          (output / 'census-module.rs').write_bytes(module)
          if os.environ['REFERENCE']:
              pathlib.Path('reference/crates/sys/src/census.rs').write_bytes(module)
              patch = subprocess.check_output(['git', '-C', 'reference', 'diff', '--', 'crates/sys/src/census.rs'])
              (output / 'census-instrumentation.patch').write_bytes(patch)
          (output / 'census-instrumentation.json').write_text(json.dumps(dict(
              module_sha256=hashlib.sha256(module).hexdigest(),
              reference=os.environ['REFERENCE']), indent=2))
          PYTHON
      - name: Build and measure complete ownership waves
        if: runner.os != 'Windows'
        working-directory: harness
        env:
          REFERENCE: ${{ inputs.paired_ref }}
        run: |
          reference=()
          if [[ -n "$REFERENCE" ]]; then reference+=(--reference-source ../reference); fi
          if [[ "$PERF_ALLOC_CENSUS" == true ]]; then reference+=(--census); fi
          if [[ -n "$PERF_RELEASE_OVERLAP" ]]; then reference+=(--overlap "$PERF_RELEASE_OVERLAP"); fi
          if [[ -n "$PERF_RESIDENCY_CASES" ]]; then reference+=(--cases "$PERF_RESIDENCY_CASES"); fi
          if [[ -n "${PERF_VMMAP:-}" ]]; then reference+=(--vmmap "$PERF_VMMAP"); fi
          python scripts/perf/residency.py --source ../measured --target "$CARGO_TARGET_DIR" --output "$RUNNER_TEMP/residency-output" --rounds "$PERF_PAIRED_ROUNDS" "${reference[@]}"
      - name: Build and measure complete ownership waves with MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: harness
        env:
          REFERENCE: ${{ inputs.paired_ref }}
        run: |
          $reference = @()
          if ($env:PERF_RELEASE_OVERLAP -eq 'engine-trace') {
            python scripts/perf/residency.py --source ../measured --target $env:CARGO_TARGET_DIR --output "$env:RUNNER_TEMP/residency-output" --engine-suites --rounds 5 --suite-scope workspace --depth-trace
            exit $LASTEXITCODE
          }
          if ($env:PERF_RELEASE_OVERLAP -eq 'engine-verify') {
            python scripts/perf/residency.py --source ../measured --target $env:CARGO_TARGET_DIR --output "$env:RUNNER_TEMP/residency-output" --engine-suites --rounds 50 --prepare-engine
            exit $LASTEXITCODE
          }
          if ($env:PERF_RELEASE_OVERLAP -eq 'engine-compare') {
            python scripts/perf/residency.py --source ../measured --reference-source ../reference --target $env:CARGO_TARGET_DIR --output "$env:RUNNER_TEMP/residency-output" --engine-suites --rounds $env:PERF_PAIRED_ROUNDS
            exit $LASTEXITCODE
          }
          if ($env:REFERENCE) { $reference += @('--reference-source', '../reference') }
          if ($env:PERF_ALLOC_CENSUS -eq 'true') { $reference += '--census' }
          if ($env:PERF_RESIDENCY_CASES) { $reference += @('--cases', $env:PERF_RESIDENCY_CASES) }
          if ($env:PERF_VMMAP) { $reference += @('--vmmap', $env:PERF_VMMAP) }
          python scripts/perf/residency.py --source ../measured --target $env:CARGO_TARGET_DIR --output "$env:RUNNER_TEMP/residency-output" --rounds $env:PERF_PAIRED_ROUNDS @reference
      - name: Full engine suite 01/50
        if: inputs.release_overlap == 'engine-verify'
        shell: pwsh
        working-directory: harness
        run: python scripts/perf/residency.py --source ../measured --target "$env:CARGO_TARGET_DIR" --output "$env:RUNNER_TEMP/residency-output" --engine-suites --rounds 50 --suite-trial 0
      - name: Full engine suite 02/50
