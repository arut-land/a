name: perf

on:
  push:
    branches: [main, 'perf/**']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      log_cuts_cpu:
        description: "Temporary log-cuts P2 CPU acceptance investigation"
        default: false
        type: boolean
      release_overlap:
        description: "Native call-entry overlap probe (reopen or turn; empty disables)"
        default: ''
        type: string
      census_vmmap:
        description: "Add native Microsoft VMMap snapshots to a Windows census"
        default: false
        type: boolean
      residency_cases:
        description: "Optional focused stored:active pairs, e.g. 32:1,32:4"
        default: ''
        type: string
      alloc_census:
        description: "Native census of the selected residency source"
        default: false
        type: boolean
      residency:
        description: "Complete lifecycle ownership waves (five alternating rounds; optional paired_ref)"
        default: false
        type: boolean
      idle_charge:
        description: "Validate native idle charge and a throwaway retained allocation"
        default: false
        type: boolean
      autostart:
        description: 'Run only the hosted autostart probe'
        default: false
        type: boolean
      variant:
        description: 'One variant as JSON: {"rustflags": ["-Ctarget-cpu=x86-64-v2"], "config": ["profile.release.package.serde_json.opt-level=2"]}'
        default: '{}'
        type: string
      runner:
        description: 'Runner label, or all'
        default: all
        type: choice
        options: [all, linux-windows, ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
      harness_ref:
        description: 'Harness revision (empty uses this workflow commit); pin for historical experiments'
        default: ''
        type: string
      source_ref:
        description: 'Source revision (empty uses this workflow revision); main bootstraps a baseline'
        default: ''
        type: string
      bloat:
        description: 'Collect native crate/function size attribution'
        default: false
        type: boolean
      profile:
        description: 'Attribute baseline instructions with Callgrind on Linux x86_64 after timing'
        default: false
        type: boolean
      build_only:
        description: 'Build and inspect a size/linker candidate without runtime measurements'
        default: false
        type: boolean
      paired_ref:
        description: 'Optional reference source revision for interleaved same-runner tuning'
        default: ''
        type: string
      paired_rounds:
        description: 'Alternating reference/candidate rounds'
        default: '5'
        type: string
      ablation:
        description: 'Paired comparison only; skip the separate unpaired suite'
        default: false
        type: boolean
      baseline_run:
        description: 'Optional bootstrap baseline run ID; otherwise latest successful main lane'
        default: ''
        type: string
      sessions:
        description: 'Run only the concurrently active sessions layouts (docs/perf/runtime-demand.md)'
        default: false
        type: boolean
      memory:
        description: 'Only memory survey workloads; skip unrelated benchmark builds'
        default: false
        type: boolean
      survey:
        description: 'Only round-2 CPU, memory and concurrent-session evidence'
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: perf-${{ github.ref }}-${{ inputs.autostart && 'autostart' || 'measure' }}-${{ inputs.runner || 'all' }}-${{ inputs.source_ref || github.sha }}-${{ inputs.paired_ref }}-${{ inputs.build_only }}-${{ inputs.sessions }}-${{ inputs.residency }}-${{ inputs.alloc_census }}-${{ inputs.census_vmmap }}-${{ inputs.release_overlap }}-${{ inputs.variant || '{}' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: false
  # Hosted jobs can use the runner; the shared development host uses two.
  CARGO_BUILD_JOBS: 4

jobs:
  log-cuts-cpu:
    if: inputs.log_cuts_cpu
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runner == 'all' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || format('["{0}"]', inputs.runner)) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      MISE_NO_ENV: 1
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.paired_ref }}
          path: baseline
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Native pinned toolchain
        run: |
          python - <<'PYTHON'
          import os, pathlib, subprocess, tomllib
          triples = {'Linux': 'x86_64-unknown-linux-gnu', 'Windows': 'x86_64-pc-windows-msvc', 'macOS': 'aarch64-apple-darwin'}
          channel = tomllib.loads(pathlib.Path('candidate/rust-toolchain.toml').read_text())['toolchain']['channel']
          toolchain = channel + '-' + triples[os.environ['RUNNER_OS']]
          subprocess.run(['rustup', 'toolchain', 'install', toolchain, '--profile', 'minimal', '--component', 'rust-src'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RUSTUP_TOOLCHAIN=' + toolchain + '\n')
              env.write('CARGO_TARGET_DIR=' + str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'tgt-log-cuts') + '\n')
          PYTHON
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold pkg-config libssl-dev
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: false
          env: false
      - name: Paired release builds
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, pathlib, re, shutil, subprocess, sys
          scratch = pathlib.Path(os.environ['RUNNER_TEMP'])
          output = scratch / 'log-cuts-cpu'
          output.mkdir()
          cargo = subprocess.check_output(['rustup', 'which', 'cargo'], text=True).strip()
          env = {key: value for key, value in os.environ.items() if not any(token in key.upper() for token in ['PROXY', 'OPENAI', 'ANTHROPIC', 'GEMINI', 'GOOGLE_API', 'AZURE', 'BEDROCK', 'AWS_', 'COHERE', 'MISTRAL', 'DEEPSEEK', 'GROQ', 'TOGETHER', 'FIREWORKS', 'OLLAMA', 'OPENROUTER'])}
          env.update(MISE_NO_ENV='1', OPENAI_API_KEY='loopback-dummy', OPENAI_BASE_URL='http://127.0.0.1:1/v1', NO_PROXY='127.0.0.1,localhost')
          env['PATH'] = str(pathlib.Path(cargo).parent) + os.pathsep + env['PATH']
          env.update(CARGO=cargo, RUSTC_WRAPPER='', RUSTC_WORKSPACE_WRAPPER='')
          for name in ['rustc', 'rustdoc']:
              env[name.upper()] = subprocess.check_output(['rustup', 'which', name], text=True).strip()
          env = {key: value for key, value in env.items() if not key.startswith('MBX_')}
          suffix = '.exe' if os.name == 'nt' else ''
          metadata = {}
          for source, arm in [('baseline', 'before'), ('candidate', 'after')]:
              root = pathlib.Path(source).resolve()
              with (output / (arm + '-build.log')).open('w') as log:
                  launch = ['mise', 'exec', '--', sys.executable, '-c', 'import os,sys,subprocess;os.environ.update(CARGO=sys.argv[1],RUSTC=sys.argv[2],RUSTDOC=sys.argv[3],CARGO_TARGET_DIR=sys.argv[4],CARGO_BUILD_JOBS="2",RUSTC_WRAPPER="",RUSTC_WORKSPACE_WRAPPER="");[os.environ.pop(k) for k in list(os.environ) if k.startswith("MBX_")];sys.exit(subprocess.call([sys.argv[1],*sys.argv[5:]]))', cargo, env['RUSTC'], env['RUSTDOC'], env['CARGO_TARGET_DIR']]
                  subprocess.run([*launch, 'clean'], cwd=root, env=env, stdout=log, stderr=subprocess.STDOUT, check=True)
                  command = [*launch, 'build-release', '-p', 'a', '--features', 'fixtures', '--message-format=json']
                  result = subprocess.run(command, cwd=root, env=env, stdout=subprocess.PIPE, stderr=log, text=True)
                  (output / (arm + '-cargo-artifacts.jsonl')).write_text(result.stdout)
                  result.check_returncode()
              artifacts = [record for line in result.stdout.splitlines() if line.startswith('{') and (record := json.loads(line)).get('executable') and record.get('target', {}).get('name') == 'a' and 'bin' in record['target']['kind']]
              assert len(artifacts) == 1, artifacts
              binary = pathlib.Path(artifacts[0]['executable']).resolve()
              assert binary.is_relative_to(pathlib.Path(env['CARGO_TARGET_DIR']).resolve()), binary
              staged = output / (arm + '-a' + suffix)
              shutil.copy2(binary, staged)
              probe = output / (arm + '-format-probe')
              probe.mkdir()
              home = probe / 'home'
              home.mkdir()
              user = probe / 'user'
              user.mkdir()
              (home / 'config.toml').write_text('[daemon]\nagent = "echo"\nidle_secs = 900\n')
              runtime = {key: value for key, value in env.items() if key.upper() in ['PATH', 'SYSTEMROOT', 'WINDIR', 'COMSPEC', 'PATHEXT', 'TEMP', 'TMP', 'TMPDIR', 'PROGRAMFILES', 'PROGRAMFILES(X86)', 'PROGRAMW6432']}
              runtime.update(HOME=str(user), USERPROFILE=str(user), A_HOME=str(home), OPENAI_API_KEY='loopback-dummy', OPENAI_BASE_URL='http://127.0.0.1:1/v1', NO_PROXY='127.0.0.1,localhost')
              try:
                  subprocess.run([str(staged), 'new'], env=runtime, cwd=probe, capture_output=True, text=True, check=True, timeout=60)
                  logs = list((home / 'sessions').rglob('log.jsonl'))
                  assert len(logs) == 1, logs
                  with logs[0].open() as stream:
                      header = json.loads(stream.readline())
              finally:
                  subprocess.run([str(staged), 'daemon', 'stop'], env=runtime, cwd=probe, check=True, timeout=60)
              expected = int(re.search(r'const FORMAT: u32 = (\d+)', (root / 'crates/engine/src/store/jsonl.rs').read_text())[1])
              metadata[arm] = {'commit': subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip(), 'artifact': str(binary), 'sha256': hashlib.sha256(staged.read_bytes()).hexdigest(), 'bytes': staged.stat().st_size, 'expected_log_format': expected, 'observed_log_format': header['format']}
              (output / 'builds.json').write_text(json.dumps(metadata, indent=2))
              assert header['format'] == expected, metadata[arm]
          assert metadata['before']['sha256'] != metadata['after']['sha256'], metadata
          (output / 'builds.json').write_text(json.dumps(metadata, indent=2))
          PYTHON
      - name: Ten fresh paired rounds
        run: |
          cat > "$RUNNER_TEMP/cpu-review.py" <<'PYTHON'
          """Temporary P2 CPU investigation: real CLI/daemon, fresh homes, loopback SSE."""
          import argparse,ctypes,hashlib,http.server,json,os,platform,re,shutil,stat,statistics,struct,subprocess,sys,tarfile,threading,time
          from pathlib import Path

          class Fixture(http.server.BaseHTTPRequestHandler):
              protocol_version='HTTP/1.1'
              def log_message(self,*args):pass
              def do_POST(self):
                  data=json.loads(self.rfile.read(int(self.headers['Content-Length'])))
                  found=None;pos=-1
                  for i,message in enumerate(data['messages']):
                      content=message.get('content','')
                      if isinstance(content,list):content='\n'.join(x.get('text','') for x in content if isinstance(x,dict))
                      if message['role']=='user' and isinstance(content,str):
                          match=re.search(r'LC (ROOT|FRESH|FORK|BG|GRAND) (\d+)',content)
                          if match:found=match.groups();pos=i
                  if found is None:self.send_error(400,'missing workload marker');return
                  role,n=found;fresh=not any(m['role']=='assistant' for m in data['messages'][pos+1:]);calls=[]
                  if fresh and role=='ROOT':
                      calls=[('task',dict(prompt=f'LC FRESH {n}')),('fork_task',dict(prompt=f'LC FORK {n}')),('background_task',dict(prompt=f'LC BG {n}',messages=[])),('bash',dict(command='sleep 0.01 & printf background-job')),('read',dict(path='input.txt')),('skill',dict(name='probe')),('glob',dict(pattern='*.txt'))]
                  if fresh and role=='FRESH':calls=[('task',dict(prompt=f'LC GRAND {n}'))]
                  self.server.requests.append(dict(role=role,turn=int(n),fresh=fresh,bytes=int(self.headers['Content-Length']),tools=len(calls)))
                  self.send_response(200);self.send_header('Content-Type','text/event-stream');self.send_header('Connection','close');self.end_headers()
                  def event(delta,finish=None):
                      record=dict(id='local',model='fixture',choices=[dict(index=0,delta=delta,finish_reason=finish)])
                      self.wfile.write(('data: '+json.dumps(record)+'\n\n').encode())
                  try:
                      event(dict(role='assistant'))
                      text=(f'LC-{role}-{n} '+('word '*((128*1024+4)//5))[:128*1024-len(f'LC-{role}-{n} ')]) if fresh else f'completed {role} {n}'
                      for offset in range(0,len(text),4096):event(dict(content=text[offset:offset+4096]))
                      if calls:event(dict(tool_calls=[dict(index=i,id=f'{role}-{n}-{i}',type='function',function=dict(name=name,arguments=json.dumps(args))) for i,(name,args) in enumerate(calls)]))
                      event({},'tool_calls' if calls else 'stop');self.wfile.write(b'data: [DONE]\n\n');self.wfile.flush()
                  except (BrokenPipeError,ConnectionResetError):self.server.errors.append('stream closed')
                  self.close_connection=True


          def cpu(pid):
              if sys.platform=='darwin':
                  buffer=ctypes.create_string_buffer(16+8*40)
                  if ctypes.CDLL('/usr/lib/libproc.dylib').proc_pid_rusage(pid,4,buffer):raise OSError('proc_pid_rusage')
                  values=struct.unpack_from('<40Q',buffer,16)
                  # Rusage CPU counters use Mach absolute ticks on this native API.
                  class Timebase(ctypes.Structure):_fields_=[('numer',ctypes.c_uint32),('denom',ctypes.c_uint32)]
                  scale=Timebase();assert ctypes.CDLL('/usr/lib/libSystem.B.dylib').mach_timebase_info(ctypes.byref(scale))==0
                  return (values[0]+values[1])*scale.numer/scale.denom/1e6
              if sys.platform=='linux':
                  fields=Path(f'/proc/{pid}/stat').read_text().rsplit(')',1)[1].split()
                  return (int(fields[11])+int(fields[12]))*1000/os.sysconf('SC_CLK_TCK')
              from ctypes import wintypes
              k=ctypes.WinDLL('kernel32',use_last_error=True)
              k.OpenProcess.argtypes=[wintypes.DWORD,wintypes.BOOL,wintypes.DWORD];k.OpenProcess.restype=wintypes.HANDLE
              k.GetProcessTimes.argtypes=[wintypes.HANDLE,*([ctypes.POINTER(wintypes.FILETIME)]*4)];k.GetProcessTimes.restype=wintypes.BOOL
              k.CloseHandle.argtypes=[wintypes.HANDLE]
              handle=k.OpenProcess(0x1000,False,pid)
              if not handle:raise ctypes.WinError(ctypes.get_last_error())
              try:
                  times=[wintypes.FILETIME() for _ in range(4)]
                  if not k.GetProcessTimes(handle,*[ctypes.byref(t) for t in times]):raise ctypes.WinError(ctypes.get_last_error())
                  return sum((t.dwHighDateTime<<32)|t.dwLowDateTime for t in times[2:])/10000
              finally:k.CloseHandle(handle)


          def case(binary,output,arm,round,roots,turns):
              folder=output/f'{round}-{arm}-{roots}x{turns}'
              if (folder/'result.json').exists():return
              folder.mkdir();home=folder/'home';home.mkdir();user=folder/'user';user.mkdir();ws=folder/'workspace';ws.mkdir()
              (ws/'input.txt').write_text('workload input\n');skill=home/'skills/probe';skill.mkdir(parents=True)
              (skill/'SKILL.md').write_text('---\nname: probe\ndescription: benchmark instructions\n---\nKeep source scopes intact.\n')
              (home/'config.toml').write_text('model = "openai@chat:fixture"\n[daemon]\nidle_secs = 900\n')
              server=http.server.ThreadingHTTPServer(('127.0.0.1',0),Fixture);server.requests=[];server.errors=[]
              threading.Thread(target=server.serve_forever,daemon=True).start()
              env={k:v for k,v in os.environ.items() if k.upper() in ('PATH','SYSTEMROOT','WINDIR','COMSPEC','PATHEXT','TEMP','TMP','TMPDIR','PROGRAMFILES','PROGRAMFILES(X86)','PROGRAMW6432')}
              env.update(TERM='xterm-256color',HOME=str(user),USERPROFILE=str(user),A_HOME=str(home),OPENAI_API_KEY='loopback-dummy',OPENAI_BASE_URL=f'http://127.0.0.1:{server.server_port}/v1',NO_PROXY='127.0.0.1,localhost')
              def run(*args):
                  result=subprocess.run([str(binary),*args],env=env,cwd=ws,input='',text=True,capture_output=True,timeout=360)
                  with (folder/'commands.jsonl').open('a') as f:f.write(json.dumps(dict(args=args,code=result.returncode,stderr=result.stderr,stdout_bytes=len(result.stdout)))+'\n')
                  if result.returncode:raise RuntimeError((args,result.returncode,result.stderr,result.stdout[-300:]))
                  return result.stdout.strip()
              try:
                  ids=[run('new') for _ in range(roots)];pid=int((home/'run/daemon.pid').read_text().splitlines()[0]);samples=[]
                  for turn in range(turns):
                      for root,sid in enumerate(ids):
                          before=cpu(pid);start=time.monotonic_ns();run('--mode','auto','-p',f'LC ROOT {turn}','attach',sid);end=cpu(pid)
                          sample=dict(turn=turn,root=root,cpu_ms=end-before,wall_ms=(time.monotonic_ns()-start)/1e6);samples.append(sample)
                          with (folder/'turns.jsonl').open('a') as f:f.write(json.dumps(sample)+'\n')
                      if turn%8==7:print(folder.name,'turn',turn+1,flush=True)
                  # Match the phase-1 audit: every scheduled tool/model must durably finish.
                  logs={}
                  for path in (home/'sessions').rglob('log.jsonl'):
                      rows=[json.loads(line) for line in path.read_text().splitlines()];logs[rows[0]['id']]=rows
                  tool_count=0;links=0
                  for sid,rows in logs.items():
                      for call,result in [('model_call','model_result'),('tool_call','tool_result')]:
                          missing={r['seq'] for r in rows if r.get('kind')==call}-{r['call'] for r in rows if r.get('kind')==result}
                          assert not missing,(sid,call,missing)
                      for row in rows:
                          if row.get('kind')=='tool_call' and row.get('tool')!='mode':tool_count+=1
                          if row.get('kind')=='link':assert row['child'] in logs;links+=1
                          if row.get('kind') in ('tool_result','model_result','fired'):assert row.get('outcome',{}).get('status')=='done',row
                  assert tool_count==roots*turns*8,(tool_count,roots*turns*8)
                  assert not server.errors,server.errors
                  result=dict(arm=arm,round=round,roots=roots,turns=turns,binary_sha256=hashlib.sha256(binary.read_bytes()).hexdigest(),late_cpu_ms=statistics.mean(s['cpu_ms'] for s in samples if s['turn']>=turns-4),samples=samples,tool_calls=tool_count,sessions=len(logs),links=links,provider_requests=server.requests,provider_errors=server.errors)
                  (folder/'result.json').write_text(json.dumps(result,indent=2));print('RESULT',folder.name,result['late_cpu_ms'],flush=True)
              finally:
                  try:run('daemon','stop')
                  finally:server.shutdown();server.server_close()
              with tarfile.open(folder/'home.tar.gz','w:gz',compresslevel=1) as archive:archive.add(home,arcname='home')
              def remove_readonly(function,path,info):
                  if os.name != 'nt' or not isinstance(info[1],PermissionError):raise info[1]
                  os.chmod(path,stat.S_IWRITE)
                  function(path)
              shutil.rmtree(home,onerror=remove_readonly)


          def main():
              p=argparse.ArgumentParser();p.add_argument('--before',type=Path,required=True);p.add_argument('--after',type=Path,required=True);p.add_argument('--output',type=Path,required=True);p.add_argument('--rounds',type=int,default=10);p.add_argument('--smoke',action='store_true');args=p.parse_args()
              args.output.mkdir(parents=True,exist_ok=True)
              (args.output/'machine.json').write_text(json.dumps(dict(system=platform.platform(),machine=platform.machine(),cores=os.cpu_count(),python=sys.version),indent=2))
              scales=[(1,2)] if args.smoke else [(1,32),(4,32),(8,32),(1,64)]
              for round in range(args.rounds):
                  for roots,turns in scales:
                      for arm in (['before','after'] if round%2==0 else ['after','before']):case(getattr(args,arm).resolve(),args.output.resolve(),arm,round,roots,turns)
              summary=[]
              for roots,turns in scales:
                  row=dict(roots=roots,turns=turns)
                  for arm in ['before','after']:
                      values=[json.loads(p.read_text())['late_cpu_ms'] for p in args.output.glob(f'*-{arm}-{roots}x{turns}/result.json')]
                      row[arm]=dict(n=len(values),median=statistics.median(values),min=min(values),max=max(values),values=values)
                  summary.append(row)
              (args.output/'summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary,indent=2),flush=True)
          if __name__=='__main__':main()
          PYTHON
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python "$RUNNER_TEMP/cpu-review.py" --before "$RUNNER_TEMP/log-cuts-cpu/before-a$suffix" --after "$RUNNER_TEMP/log-cuts-cpu/after-a$suffix" --output "$RUNNER_TEMP/log-cuts-cpu/samples" --rounds 10
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: log-cuts-cpu-samples-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/log-cuts-cpu/builds.json
            ${{ runner.temp }}/log-cuts-cpu/*-build.log
            ${{ runner.temp }}/log-cuts-cpu/*-cargo-artifacts.jsonl
            ${{ runner.temp }}/log-cuts-cpu/samples/**/result.json
            ${{ runner.temp }}/log-cuts-cpu/samples/**/turns.jsonl
            ${{ runner.temp }}/log-cuts-cpu/samples/summary.json
            ${{ runner.temp }}/log-cuts-cpu/samples/machine.json
            ${{ runner.temp }}/cpu-review.py
          retention-days: 14
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: log-cuts-cpu-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/log-cuts-cpu
            ${{ runner.temp }}/cpu-review.py
          retention-days: 14

  residency:
    if: inputs.residency || inputs.alloc_census || inputs.census_vmmap || inputs.release_overlap
    name: residency (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.census_vmmap && inputs.runner == 'all' && '["windows-latest", "windows-11-arm"]' || inputs.alloc_census && inputs.runner == 'all' && '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "windows-11-arm", "macos-latest", "macos-15-intel"]' || inputs.runner == 'linux-windows' && '["ubuntu-latest", "windows-latest"]' || inputs.runner && inputs.runner != 'all' && format('["{0}"]', inputs.runner) || '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "windows-11-arm", "macos-latest", "macos-15-intel"]') }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
      PYTHONDONTWRITEBYTECODE: 1
      MISE_NO_ENV: 1
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_CARGO_BINSTALL_NATIVE: 'true'
      PERF_ALLOC_CENSUS: ${{ inputs.alloc_census || inputs.census_vmmap || false }}
      PERF_RESIDENCY_CASES: ${{ inputs.residency_cases }}
      PERF_PAIRED_ROUNDS: ${{ inputs.paired_rounds || '5' }}
      PERF_RELEASE_OVERLAP: ${{ inputs.release_overlap }}
    steps:
      - name: External build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tgt-native-release" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.harness_ref || github.sha }}
          path: harness
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: measured
      - uses: actions/checkout@v7
        if: inputs.paired_ref != ''
        with:
          ref: ${{ inputs.paired_ref }}
          path: reference
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.2.2
      - name: Select native toolchain
        working-directory: measured
        run: |
          python - <<'PYTHON'
          import os, tomllib
          targets = {
              ('Linux', 'X64'): 'x86_64-unknown-linux-gnu',
              ('Linux', 'ARM64'): 'aarch64-unknown-linux-gnu',
              ('Windows', 'X64'): 'x86_64-pc-windows-msvc',
              ('Windows', 'ARM64'): 'aarch64-pc-windows-msvc',
              ('macOS', 'X64'): 'x86_64-apple-darwin',
              ('macOS', 'ARM64'): 'aarch64-apple-darwin',
          }
          channel = tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel']
          target = targets[os.environ['RUNNER_OS'], os.environ['RUNNER_ARCH']]
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RUSTUP_TOOLCHAIN={channel}-{target}\n')
          PYTHON
      - working-directory: measured
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src --component rustfmt --component clippy
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld mold pkg-config libssl-dev
      - uses: jdx/mise-action@v5
        with:
          working_directory: measured
          install_args: cargo:cargo-nextest@0.9.150
          env: false
      - name: Native Cargo path
        working-directory: measured
        run: echo "$(dirname "$(rustup which cargo)")" >> "$GITHUB_PATH"
      - name: Native VMMap diagnostic tool
        if: inputs.census_vmmap && runner.os == 'Windows'
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, pathlib, urllib.request, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'census-vmmap'
          root.mkdir()
          archive = root / 'VMMap.zip'
          url = 'https://download.sysinternals.com/files/VMMap.zip'
          urllib.request.urlretrieve(url, archive)
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(root)
          name = 'vmmap64a.exe' if os.environ['RUNNER_ARCH'] == 'ARM64' else 'vmmap64.exe'
          executable = next(path for path in root.iterdir() if path.name.lower() == name)
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'residency-output'
          output.mkdir()
          (output / 'vmmap-tool.json').write_text(json.dumps(dict(
              source=url, archive_sha256=hashlib.sha256(archive.read_bytes()).hexdigest(),
              binary=executable.name, sha256=hashlib.sha256(executable.read_bytes()).hexdigest()), indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PERF_VMMAP={executable}\n')
          PYTHON
      - name: Share identical fixture instrumentation between paired sources
        if: inputs.alloc_census || inputs.census_vmmap
        env:
          REFERENCE: ${{ inputs.paired_ref }}
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess
          module = pathlib.Path('measured/crates/sys/src/census.rs').read_bytes()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'residency-output'
          output.mkdir(exist_ok=True)
          (output / 'census-module.rs').write_bytes(module)
          if os.environ['REFERENCE']:
              pathlib.Path('reference/crates/sys/src/census.rs').write_bytes(module)
              patch = subprocess.check_output(['git', '-C', 'reference', 'diff', '--', 'crates/sys/src/census.rs'])
              (output / 'census-instrumentation.patch').write_bytes(patch)
          (output / 'census-instrumentation.json').write_text(json.dumps(dict(
              module_sha256=hashlib.sha256(module).hexdigest(),
              reference=os.environ['REFERENCE']), indent=2))
          PYTHON
      - name: Build and measure complete ownership waves
        if: runner.os != 'Windows'
        working-directory: harness
        env:
          REFERENCE: ${{ inputs.paired_ref }}
        run: |
          reference=()
          if [[ -n "$REFERENCE" ]]; then reference+=(--reference-source ../reference); fi
          if [[ "$PERF_ALLOC_CENSUS" == true ]]; then reference+=(--census); fi
          if [[ -n "$PERF_RELEASE_OVERLAP" ]]; then reference+=(--overlap "$PERF_RELEASE_OVERLAP"); fi
          if [[ -n "$PERF_RESIDENCY_CASES" ]]; then reference+=(--cases "$PERF_RESIDENCY_CASES"); fi
          if [[ -n "${PERF_VMMAP:-}" ]]; then reference+=(--vmmap "$PERF_VMMAP"); fi
          python scripts/perf/residency.py --source ../measured --target "$CARGO_TARGET_DIR" --output "$RUNNER_TEMP/residency-output" --rounds "$PERF_PAIRED_ROUNDS" "${reference[@]}"
      - name: Build and measure complete ownership waves with MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: harness
        env:
          REFERENCE: ${{ inputs.paired_ref }}
        run: |
          $reference = @()
          if ($env:REFERENCE) { $reference += @('--reference-source', '../reference') }
          if ($env:PERF_ALLOC_CENSUS -eq 'true') { $reference += '--census' }
          if ($env:PERF_RESIDENCY_CASES) { $reference += @('--cases', $env:PERF_RESIDENCY_CASES) }
          if ($env:PERF_VMMAP) { $reference += @('--vmmap', $env:PERF_VMMAP) }
          python scripts/perf/residency.py --source ../measured --target $env:CARGO_TARGET_DIR --output "$env:RUNNER_TEMP/residency-output" --rounds $env:PERF_PAIRED_ROUNDS @reference
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: residency-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/residency-output/*.json*
            ${{ runner.temp }}/residency-output/*.md
            ${{ runner.temp }}/residency-output/*.csv
            ${{ runner.temp }}/residency-output/*.patch
            ${{ runner.temp }}/residency-output/census-module.rs
          retention-days: 30
      - name: Clean owned target
        if: always()
        working-directory: measured
        run: |
          mise exec -- "$(rustup which cargo)" clean --target-dir "$CARGO_TARGET_DIR"
          python - <<'PYTHON'
          import os, shutil
          shutil.rmtree(os.environ['CARGO_TARGET_DIR'], ignore_errors=True)
          PYTHON

  idle-charge:
    if: inputs.idle_charge
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
      PYTHONDONTWRITEBYTECODE: 1
    name: idle charge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.2.2
      - name: Select native Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "RUSTUP_TOOLCHAIN=$channel-${{ matrix.target }}" >> "$GITHUB_ENV"
          rustup toolchain install "$channel-${{ matrix.target }}" --profile minimal --component rust-src
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold pkg-config libssl-dev
      - name: Validate real processes and the retained-allocation rejection
        run: python scripts/perf/idle-charge.py --output "$RUNNER_TEMP/idle-charge-output" --target "$RUNNER_TEMP/idle-charge-target"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: idle-charge-${{ matrix.os }}
          path: ${{ runner.temp }}/idle-charge-output/*.json

  measure:
    if: ${{ !inputs.log_cuts_cpu && github.event_name != 'schedule' && !inputs.autostart && !inputs.idle_charge && !inputs.residency && !inputs.alloc_census && !inputs.census_vmmap && !inputs.release_overlap }}
    name: perf (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    # Churn workloads and twenty-round ablations need longer than the standard suite.
    timeout-minutes: ${{ inputs.sessions && 240 || (inputs.ablation || inputs.survey || inputs.memory) && 180 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runner == 'linux-windows' && '["ubuntu-latest", "windows-latest"]' || inputs.runner && inputs.runner != 'all' && format('["{0}"]', inputs.runner) || '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "windows-11-arm", "macos-latest", "macos-15-intel"]') }}
    env:
      PERF_PAIRED_ROUNDS: ${{ inputs.paired_rounds || '5' }}
      PERF_ABLATION: ${{ inputs.ablation || false }}
      PERF_VARIANT: ${{ inputs.variant || '{}' }}
      PERF_REFERENCE: ${{ inputs.paired_ref }}
      PERF_BUILD_ONLY: ${{ inputs.build_only }}
      PERF_BLOAT: ${{ inputs.bloat }}
      PERF_SESSIONS: ${{ inputs.sessions || false }}
      PERF_MEMORY: ${{ inputs.memory || false }}
      PERF_SURVEY: ${{ inputs.survey || false }}
    defaults:
      run:
        shell: bash
        working-directory: harness
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v7
        with:
          path: harness
          ref: ${{ inputs.harness_ref || github.sha }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: measured
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Native accounting and toolchain
        run: |
          python -m pip install psutil==7.2.2
          python - <<'PYTHON'
          import json, os, platform, sys, tomllib
          from pathlib import Path
          sys.path.insert(0, 'scripts/perf')
          from hosted import hardware
          output = Path('target/hosted-perf')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'host.json').write_text(json.dumps(dict(
              platform=platform.platform(), machine=platform.machine(), hardware=hardware(),
              workflow_revision=os.environ.get('GITHUB_SHA')), indent=2) + '\n')
          targets = {
              ('Linux', 'X64'): 'x86_64-unknown-linux-gnu',
              ('Linux', 'ARM64'): 'aarch64-unknown-linux-gnu',
              ('Windows', 'X64'): 'x86_64-pc-windows-msvc',
              ('Windows', 'ARM64'): 'aarch64-pc-windows-msvc',
              ('macOS', 'X64'): 'x86_64-apple-darwin',
              ('macOS', 'ARM64'): 'aarch64-apple-darwin',
          }
          channel = tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel']
          target = targets[os.environ['RUNNER_OS'], os.environ['RUNNER_ARCH']]
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RUSTUP_TOOLCHAIN={channel}-{target}\n')
          PYTHON
          echo "RUSTUP_HOME=$RUNNER_TEMP/perf-rustup" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: perf-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('harness/rust-toolchain.toml', 'harness/Cargo.lock', 'harness/.cargo/*.toml') }}-${{ github.run_id }}
          restore-keys: perf-v2-${{ runner.os }}-${{ runner.arch }}-
      # ARM Windows has no Cranelift component; release and benches use LLVM.
      - id: toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src
      - uses: jdx/mise-action@v5
        with:
          working_directory: harness
          install_args: hyperfine ${{ runner.os == 'Linux' && 'mold' || '' }}
      - name: Inherit the native toolchain for all Cargo commands
        run: python scripts/perf/hosted.py --phase toolchain --runner '${{ matrix.runner }}'
      - run: python -m unittest discover -s scripts/perf -p 'test_*.py'
      - if: inputs.bloat
        name: Install native size attribution tool
        run: |
          cargo install cargo-bloat --version 0.12.1 --locked --root "$RUNNER_TEMP/perf-tools"
          echo "$RUNNER_TEMP/perf-tools/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang pkg-config libssl-dev
      # Retain the Intel lane's existing native artifact cache.
      - uses: Swatinem/rust-cache@v2
        if: matrix.runner == 'macos-15-intel'
        with:
          workspaces: measured -> target/perf-build
          cache-all-crates: true
          cache-on-failure: true
      - name: Install the same measurement harness into the source checkout
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          for path in ['apps/cli/examples/perf-attach.rs', 'crates/engine/src/driver/tests/bench.rs']:
              Path('../measured/' + path).parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, '../measured/' + path)
          PY
      - name: Build release binaries and saved benchmarks
        id: build
        if: env.PERF_SESSIONS != 'true' && env.PERF_MEMORY != 'true' && env.PERF_SURVEY != 'true'
        run: |
          extra=()
          if [[ "$PERF_BUILD_ONLY" == true ]]; then extra+=(--build-only); fi
          if [[ "$PERF_BLOAT" == true ]]; then extra+=(--bloat); fi
          python scripts/perf/hosted.py --phase build --source ../measured --variant "$PERF_VARIANT" --runner '${{ matrix.runner }}' "${extra[@]}"
      - name: Measure startup workloads and benches
        timeout-minutes: 20
        if: env.PERF_BUILD_ONLY != 'true' && env.PERF_ABLATION != 'true' && env.PERF_SESSIONS != 'true' && env.PERF_MEMORY != 'true' && env.PERF_SURVEY != 'true'
        run: |
          python scripts/perf/hosted.py --phase measure --source ../measured --variant "$PERF_VARIANT" --runner '${{ matrix.runner }}'
      - name: Measure alternating reference and candidate rounds
        timeout-minutes: ${{ inputs.ablation && 140 || 45 }}
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.PERF_REFERENCE != '' && env.PERF_BUILD_ONLY != 'true' }}
        run: |
          python scripts/perf/hosted.py --phase paired --source ../measured --variant "$PERF_VARIANT" --runner '${{ matrix.runner }}' --paired-ref "$PERF_REFERENCE"
      - name: Measure concurrently active sessions
        if: env.PERF_SESSIONS == 'true'
        timeout-minutes: 210
        run: |
          python scripts/perf/hosted.py --phase sessions --source ../measured --variant "$PERF_VARIANT" --runner '${{ matrix.runner }}' --paired-ref "$PERF_REFERENCE"
      - name: Measure survey CPU and memory workloads
        if: env.PERF_BUILD_ONLY != 'true' && env.PERF_ABLATION != 'true' && env.PERF_SESSIONS != 'true'
        run: |
          phase=evidence
          if [[ "$PERF_MEMORY" == true ]]; then phase=memory; fi
          if [[ "$PERF_SURVEY" == true ]]; then phase=survey; fi
          python scripts/perf/hosted.py --phase "$phase" --source ../measured --variant "$PERF_VARIANT" --runner '${{ matrix.runner }}'
      - name: Compare with main
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          if [[ -f target/hosted-perf/result.json ]]; then
            python scripts/perf/compare.py target/hosted-perf/result.json --baseline-run "$BASELINE_RUN"
          elif [[ -f target/hosted-perf/build.json ]]; then
            python - <<'PYTHON'
          import json, os
          from pathlib import Path
          result = json.loads(Path('target/hosted-perf/build.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f"Build observation: {result['shipped_bytes'] / 1024:.3f} KiB. Runtime metrics were not completed.\n")
          PYTHON
          fi
      - name: Attribute hot paths
        if: ${{ !cancelled() && inputs.profile && matrix.runner == 'ubuntu-latest' && steps.build.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          sudo apt-get install -y --no-install-recommends valgrind
          python scripts/perf/profile.py ../measured
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: perf-${{ matrix.runner }}
          path: |
            harness/target/hosted-perf/**/a
            harness/target/hosted-perf/**/a.exe
            harness/target/hosted-perf/**/a-fixtures
            harness/target/hosted-perf/**/a-fixtures.exe
            harness/target/hosted-perf/**/*-bench
            harness/target/hosted-perf/**/*-bench.exe
            harness/target/hosted-perf/**/perf-probe
            harness/target/hosted-perf/**/perf-probe.exe
            harness/target/hosted-perf/**/*.json
            harness/target/hosted-perf/**/*.jsonl
            harness/target/hosted-perf/**/*.md
            harness/target/hosted-perf/**/*.callgrind
            harness/target/hosted-perf/**/*.dSYM/**
            harness/target/hosted-perf/**/*.dwp
            harness/target/hosted-perf/**/*.pdb
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/cache/save@v6
        if: always() && steps.toolchain.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Autostart's lifetime handshake against each OS's real service manager
  # (scripts/autostart/hosted.py). It registers with the runner's own user
  # manager, so it runs only on disposable hosted runners: weekly and on demand.
  autostart:
    if: github.event_name == 'schedule' || inputs.autostart
    name: autostart (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 4
      MISE_AUTO_INSTALL: false
      CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang pkg-config libssl-dev
      - if: runner.os == 'Linux'
        uses: jdx/mise-action@v5
        with:
          install_args: mold
      - if: runner.os == 'Linux'
        name: Use native Cargo without the optional mise wrapper
        run: echo "$(dirname "$(rustup which cargo)")" >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        name: Install native toolchain
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.*)"').Matches.Groups[1].Value
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $toolchain = "$channel-$arch-pc-windows-msvc"
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
          rustup toolchain install $toolchain --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p a
      - if: runner.os == 'Linux'
        name: User manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/autostart/hosted.py target/release/a${{ runner.os == 'Windows' && '.exe' || '' }}
      - if: failure() && runner.os == 'Linux'
        run: journalctl --user -u 'a-daemon-*.service' --no-pager -n 150
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: autostart-${{ matrix.runner }}
          path: autostart-result.json
