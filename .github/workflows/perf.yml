        if: inputs.release_overlap == 'engine-verify'
        shell: pwsh
        working-directory: harness
        run: python scripts/perf/residency.py --source ../measured --target "$env:CARGO_TARGET_DIR" --output "$env:RUNNER_TEMP/residency-output" --engine-suites --rounds 50 --suite-trial 40
      - name: Full engine suite 42/50
        if: inputs.release_overlap == 'engine-verify'
        shell: pwsh
