name: perf

on:
  push:
    branches: [main, 'perf/**']
  workflow_dispatch:
    inputs:
      variant:
        description: 'One variant as JSON: {"rustflags": ["-Ctarget-cpu=x86-64-v2"], "config": ["profile.release.package.serde_json.opt-level=2"]}'
        default: '{}'
        type: string
      runner:
        description: 'Runner label, or all'
        default: all
        type: string
      source_ref:
        description: 'Source revision (empty uses this workflow revision); main bootstraps a baseline'
        default: ''
        type: string
      baseline_run:
        description: 'Optional bootstrap baseline run ID; otherwise latest successful main'
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: perf-${{ github.ref }}-${{ inputs.runner || 'all' }}-${{ inputs.source_ref || github.sha }}-${{ inputs.variant || '{}' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: false
  # Hosted jobs can use the runner; the shared development host uses two.
  CARGO_BUILD_JOBS: 4

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.select.outputs.runners }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts/perf -p 'test_*.py'
      - id: select
        env:
          SELECTED: ${{ inputs.runner || 'all' }}
        run: |
          python3 - <<'PY'
          import json, os
          runners = ['ubuntu-latest', 'ubuntu-24.04-arm', 'windows-latest', 'windows-11-arm', 'macos-latest', 'macos-15-intel']
          selected = os.environ['SELECTED']
          assert selected == 'all' or selected in runners, selected
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('runners=' + json.dumps(runners if selected == 'all' else [selected]) + '\n')
          PY

  measure:
    needs: matrix
    name: perf (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.matrix.outputs.runners) }}
    defaults:
      run:
        shell: bash
        working-directory: harness
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: measured
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Native accounting and toolchain
        run: |
          python -m pip install psutil==7.2.2
          channel=$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          echo "MBX_CACHE_DIR=$RUNNER_TEMP/mbx" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s scripts/perf -p 'test_*.py'
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/mbx/actions
          key: perf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('harness/rust-toolchain.toml', 'harness/Cargo.lock', 'harness/.cargo/*.toml') }}-${{ github.run_id }}
          restore-keys: perf-${{ runner.os }}-${{ runner.arch }}-
      # ARM Windows has no Cranelift component; release and benches use LLVM.
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src
      - uses: jdx/mise-action@v5
        with:
          working_directory: harness
          install_args: hyperfine ${{ matrix.runner != 'macos-15-intel' && 'mr-boxington' || '' }} ${{ runner.os == 'Linux' && 'mold' || '' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang pkg-config libssl-dev
      # mbx publishes no Intel macOS executable; cache Cargo's native build there.
      - uses: Swatinem/rust-cache@v2
        if: matrix.runner == 'macos-15-intel'
        with:
          workspaces: measured -> target/perf-build
          cache-all-crates: true
          cache-on-failure: true
      - name: Install the same measurement harness into the source checkout
        run: |
          python - <<'PY'
          import shutil
          for path in ['apps/cli/examples/perf-attach.rs', 'crates/engine/src/driver/tests/bench.rs']:
              shutil.copy2(path, '../measured/' + path)
          PY
      - name: Build, then measure one variant
        env:
          PERF_VARIANT: ${{ inputs.variant || '{}' }}
        run: |
          if [[ '${{ matrix.runner }}' == macos-15-intel ]]; then
            PERF_CARGO="$(rustup which cargo)" python scripts/perf/hosted.py --source ../measured --variant "$PERF_VARIANT" --runner '${{ matrix.runner }}'
          else
            mise exec -- python scripts/perf/hosted.py --source ../measured --variant "$PERF_VARIANT" --runner '${{ matrix.runner }}'
          fi
      - name: Compare with main
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          if [[ -f target/hosted-perf/result.json ]]; then
            python scripts/perf/compare.py target/hosted-perf/result.json --baseline-run "$BASELINE_RUN"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: perf-${{ matrix.runner }}
          path: |
            harness/target/hosted-perf/**/*.json
            harness/target/hosted-perf/**/*.jsonl
            harness/target/hosted-perf/**/*.md
          if-no-files-found: error
          retention-days: 30
      - uses: actions/cache/save@v6
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/mbx/actions
          key: ${{ steps.cache.outputs.cache-primary-key }}
