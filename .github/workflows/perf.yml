name: perf

on:
  push:
    branches: [main, 'perf/**']
  workflow_dispatch:
    inputs:
      variant:
        description: 'One variant as JSON: {"rustflags": ["-Ctarget-cpu=x86-64-v2"], "config": ["profile.release.package.serde_json.opt-level=2"]}'
        default: '{}'
        type: string
      runner:
        description: 'Runner label, or all'
        default: all
        type: string
      source_ref:
        description: 'Source revision (empty uses this workflow revision); main bootstraps a baseline'
        default: ''
        type: string
      bloat:
        description: 'Collect native crate/function size attribution'
        default: false
        type: boolean
      profile:
        description: 'Attribute baseline instructions with Callgrind on Linux x86_64 after timing'
        default: false
        type: boolean
      build_only:
        description: 'Build and inspect a size/linker candidate without runtime measurements'
        default: false
        type: boolean
      paired_ref:
        description: 'Optional reference source revision for interleaved same-runner tuning'
        default: ''
        type: string
      baseline_run:
        description: 'Optional bootstrap baseline run ID; otherwise latest successful main lane'
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: perf-${{ github.ref }}-${{ inputs.runner || 'all' }}-${{ inputs.source_ref || github.sha }}-${{ inputs.paired_ref }}-${{ inputs.build_only }}-${{ inputs.variant || '{}' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: false
  # Hosted jobs can use the runner; the shared development host uses two.
  CARGO_BUILD_JOBS: 4

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.select.outputs.runners }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        env:
          SELECTED: ${{ inputs.runner || 'all' }}
        run: |
          python3 - <<'PY'
          import json, os
          runners = ['ubuntu-latest', 'ubuntu-24.04-arm', 'windows-latest', 'windows-11-arm', 'macos-latest', 'macos-15-intel']
          selected = os.environ['SELECTED']
          assert selected == 'all' or selected in runners, selected
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('runners=' + json.dumps(runners if selected == 'all' else [selected]) + '\n')
          PY

  measure:
    needs: matrix
    name: perf (${{ matrix.runner }})
    runs-on: ${{ matrix.runner == 'macos-latest' && 'macos-15' || matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.matrix.outputs.runners) }}
    env:
      PERF_VARIANT: ${{ inputs.variant || '{}' }}
      PERF_REFERENCE: ${{ inputs.paired_ref }}
      PERF_BUILD_ONLY: ${{ inputs.build_only }}
      PERF_BLOAT: ${{ inputs.bloat }}
    defaults:
      run:
        shell: bash
        working-directory: harness
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: measured
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Native accounting and toolchain
        run: |
          python -m pip install psutil==7.2.2
          python - <<'PYTHON'
          import os, tomllib
          targets = {
              ('Linux', 'X64'): 'x86_64-unknown-linux-gnu',
              ('Linux', 'ARM64'): 'aarch64-unknown-linux-gnu',
              ('Windows', 'X64'): 'x86_64-pc-windows-msvc',
              ('Windows', 'ARM64'): 'aarch64-pc-windows-msvc',
              ('macOS', 'X64'): 'x86_64-apple-darwin',
              ('macOS', 'ARM64'): 'aarch64-apple-darwin',
          }
          channel = tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel']
          target = targets[os.environ['RUNNER_OS'], os.environ['RUNNER_ARCH']]
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RUSTUP_TOOLCHAIN={channel}-{target}\n')
          PYTHON
          echo "RUSTUP_HOME=$RUNNER_TEMP/perf-rustup" >> "$GITHUB_ENV"
          echo "MBX_CACHE_DIR=$RUNNER_TEMP/mbx" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s scripts/perf -p 'test_*.py'
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/mbx/actions
          key: perf-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('harness/rust-toolchain.toml', 'harness/Cargo.lock', 'harness/.cargo/*.toml') }}-${{ github.run_id }}
          restore-keys: perf-v2-${{ runner.os }}-${{ runner.arch }}-
      # ARM Windows has no Cranelift component; release and benches use LLVM.
      - id: toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src
      - uses: jdx/mise-action@v5
        with:
          working_directory: harness
          install_args: hyperfine ${{ matrix.runner != 'macos-15-intel' && 'mr-boxington' || '' }} ${{ runner.os == 'Linux' && 'mold' || '' }}
      - if: inputs.bloat
        name: Install native size attribution tool
        run: |
          rustup run "$RUSTUP_TOOLCHAIN" cargo install cargo-bloat --version 0.12.1 --locked --root "$RUNNER_TEMP/perf-tools"
          echo "$RUNNER_TEMP/perf-tools/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang pkg-config libssl-dev
      # mbx publishes no Intel macOS executable; cache Cargo's native build there.
      - uses: Swatinem/rust-cache@v2
        if: matrix.runner == 'macos-15-intel'
        with:
          workspaces: measured -> target/perf-build
          cache-all-crates: true
          cache-on-failure: true
      - name: Install the same measurement harness into the source checkout
        run: |
          python - <<'PY'
          import shutil
          for path in ['apps/cli/examples/perf-attach.rs', 'crates/engine/src/driver/tests/bench.rs']:
              shutil.copy2(path, '../measured/' + path)
          PY
      - name: Build release binaries and saved benchmarks
        id: build
        run: |
          extra=()
          if [[ "$PERF_BUILD_ONLY" == true ]]; then extra+=(--build-only); fi
          if [[ "$PERF_BLOAT" == true ]]; then extra+=(--bloat); fi
          if [[ '${{ matrix.runner }}' == macos-15-intel ]]; then
            PERF_CARGO="$(rustup which cargo)" python scripts/perf/hosted.py --phase build --source ../measured --variant "$PERF_VARIANT" --runner '${{ matrix.runner }}' "${extra[@]}"
          else
            mise exec -- python scripts/perf/hosted.py --phase build --source ../measured --variant "$PERF_VARIANT" --runner '${{ matrix.runner }}' "${extra[@]}"
          fi
      - name: Measure startup workloads and benches
        timeout-minutes: 20
        if: env.PERF_BUILD_ONLY != 'true'
        run: |
          if [[ '${{ matrix.runner }}' == macos-15-intel ]]; then
            python scripts/perf/hosted.py --phase measure --source ../measured --variant "$PERF_VARIANT" --runner '${{ matrix.runner }}'
          else
            mise exec -- python scripts/perf/hosted.py --phase measure --source ../measured --variant "$PERF_VARIANT" --runner '${{ matrix.runner }}'
          fi
      - name: Temporary process capture RSS probe
        if: env.PERF_BUILD_ONLY != 'true'
        run: python scripts/perf/process_wave.py
      - name: Measure alternating reference and candidate rounds
        timeout-minutes: 45
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.PERF_REFERENCE != '' && env.PERF_BUILD_ONLY != 'true' }}
        run: |
          if [[ '${{ matrix.runner }}' == macos-15-intel ]]; then
            PERF_CARGO="$(rustup which cargo)" python scripts/perf/hosted.py --phase paired --source ../measured --variant "$PERF_VARIANT" --runner '${{ matrix.runner }}' --paired-ref "$PERF_REFERENCE"
          else
            mise exec -- python scripts/perf/hosted.py --phase paired --source ../measured --variant "$PERF_VARIANT" --runner '${{ matrix.runner }}' --paired-ref "$PERF_REFERENCE"
          fi
      - name: Compare with main
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          if [[ -f target/hosted-perf/result.json ]]; then
            python scripts/perf/compare.py target/hosted-perf/result.json --baseline-run "$BASELINE_RUN"
          elif [[ -f target/hosted-perf/build.json ]]; then
            python - <<'PYTHON'
          import json, os
          from pathlib import Path
          result = json.loads(Path('target/hosted-perf/build.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f"Build observation: {result['shipped_bytes'] / 1024:.3f} KiB. Runtime metrics were not completed.\n")
          PYTHON
          fi
      - name: Attribute hot paths
        if: ${{ !cancelled() && inputs.profile && matrix.runner == 'ubuntu-latest' && steps.build.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          sudo apt-get install -y --no-install-recommends valgrind
          mise exec -- python scripts/perf/profile.py ../measured
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: perf-${{ matrix.runner }}
          path: |
            harness/target/hosted-perf/a
            harness/target/hosted-perf/a.exe
            harness/target/hosted-perf/**/*.json
            harness/target/hosted-perf/**/*.jsonl
            harness/target/hosted-perf/**/*.md
            harness/target/hosted-perf/**/*.callgrind
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/cache/save@v6
        if: always() && steps.toolchain.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/mbx/actions
          key: ${{ steps.cache.outputs.cache-primary-key }}
