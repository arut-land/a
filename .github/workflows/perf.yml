        run: python scripts/perf/residency.py --source ../measured --target "$env:CARGO_TARGET_DIR" --output "$env:RUNNER_TEMP/residency-output" --engine-suites --rounds 50 --suite-trial 42
      - name: Full engine suite 44/50
