name: win-reap diagnostics
run-name: windows retirement verification on merged main
on:
  push:
    branches: [win-reap]
    paths: ['.github/workflows/win-reap.yml']
jobs:
  paired:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
    defaults:
      run:
        shell: pwsh
    steps:
      - run: |
          git config --global core.autocrlf false
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/win-reap-target" >> $env:GITHUB_ENV
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/win-reap-target
          key: win-reap-paired-${{ matrix.os }}-${{ github.sha }}
          restore-keys: win-reap-${{ matrix.os }}-
      - name: Install native Rust
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.*)"').Matches.Groups[1].Value
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $toolchain = "$channel-$arch-pc-windows-msvc"
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
          rustup toolchain install $toolchain --profile minimal --component rust-src,clippy
      - name: Build before and after test hosts
        run: |
          foreach ($file in @('proc.rs', 'proc_windows.rs')) {
            Copy-Item "crates/sys/src/$file" "$env:RUNNER_TEMP/candidate-$file"
            git show "e02028221a76049595e74828425d95f900433602:crates/sys/src/$file" | Set-Content "crates/sys/src/$file" -Encoding utf8NoBOM
          }
          foreach ($profile in @('release', 'dev')) {
            $flags = @()
            if ($profile -eq 'release') { $flags = @('--release') }
            cargo test @flags -p engine --lib --no-run --message-format=json | Set-Content "$env:RUNNER_TEMP/before-$profile.jsonl"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $records = Get-Content "$env:RUNNER_TEMP/before-$profile.jsonl" | ForEach-Object { $_ | ConvertFrom-Json }
            $exe = ($records | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'engine' -and $_.executable }).executable
            Copy-Item $exe "$env:RUNNER_TEMP/before-$profile.exe"
          }
          foreach ($file in @('proc.rs', 'proc_windows.rs')) { Copy-Item "$env:RUNNER_TEMP/candidate-$file" "crates/sys/src/$file" }
          cargo clippy -p sys -p engine -p ext-shell --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($profile in @('release', 'dev')) {
            $flags = @()
            if ($profile -eq 'release') { $flags = @('--release') }
            cargo test @flags -p engine -p sys --lib --no-run --message-format=json | Set-Content "$env:RUNNER_TEMP/after-$profile.jsonl"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Consecutive native invariant passes
        run: |
          foreach ($profile in @('release', 'dev')) {
            $records = Get-Content "$env:RUNNER_TEMP/after-$profile.jsonl" | ForEach-Object { $_ | ConvertFrom-Json }
            $exe = ($records | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'sys' -and $_.executable }).executable
            for ($i = 1; $i -le 100; $i++) {
              foreach ($test in @('termination_retains_watches_for_members_still_exiting', 'retirement_keeps_every_member_beyond_a_watch_batch')) {
                & $exe --exact "proc::imp::tests::$test" --nocapture
                if ($LASTEXITCODE) { throw "$profile $test failed at sample $i" }
              }
            }
            Write-Output "NATIVE $profile 100 consecutive passes for each invariant"
          }
      - name: Interleaved engine retirement samples
        run: |
          $afterFailures = 0
          foreach ($profile in @('release', 'dev')) {
            $records = Get-Content "$env:RUNNER_TEMP/after-$profile.jsonl" | ForEach-Object { $_ | ConvertFrom-Json }
            $candidate = ($records | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'engine' -and $_.executable }).executable
            for ($i = 1; $i -le 100; $i++) {
              $order = if ($i % 2) { @('before', 'after') } else { @('after', 'before') }
              foreach ($version in $order) {
                $exe = if ($version -eq 'before') { "$env:RUNNER_TEMP/before-$profile.exe" } else { $candidate }
                $timer = [Diagnostics.Stopwatch]::StartNew()
                & $exe --exact tests::scoped_processes::last_demand_and_shutdown_reap_the_process_and_its_descendants --nocapture
                $code = $LASTEXITCODE
                $timer.Stop()
                $record = @{ profile=$profile; version=$version; sample=$i; code=$code; ms=$timer.Elapsed.TotalMilliseconds } | ConvertTo-Json -Compress
                Add-Content "$env:RUNNER_TEMP/win-reap-measures.jsonl" $record
                Write-Output "MEASURE $record"
                if ($version -eq 'after' -and $code) { $afterFailures++ }
              }
            }
          }
          if ($afterFailures) { throw "$afterFailures candidate engine failures" }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: win-reap-${{ matrix.os }}
          path: ${{ runner.temp }}/win-reap-measures.jsonl
