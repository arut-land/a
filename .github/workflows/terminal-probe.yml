name: terminal probe
on:
  push:
    branches: [codex-w3term]
  workflow_dispatch:
concurrency:
  group: terminal-probe-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
      MISE_AUTO_INSTALL: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington ${{ runner.os == 'Linux' && 'mold' || '' }}
      - run: |
          mise exec -- cargo test -p sys terminal:: -- --nocapture --test-threads=1
