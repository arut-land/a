name: diagnostics musl probe
on: workflow_dispatch
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
  A_HOME: ${{ github.workspace }}/isolated-home
jobs:
  static-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Inspect static PIE and fixed-address ELF images
        shell: bash
        run: |
          export RUSTUP_TOOLCHAIN="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
          diag_linker="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"
          for relocation in pic static; do
            RUSTFLAGS="-Clinker=$diag_linker -Clinker-flavor=gnu-lld -Clink-self-contained=yes -Clink-arg=--build-id=sha1 -Crelocation-model=$relocation" \
              cargo test -p sys --target x86_64-unknown-linux-musl \
                crash::image::tests::a_program_counter_identifies_its_image_without_symbol_lookup -- --exact
          done
