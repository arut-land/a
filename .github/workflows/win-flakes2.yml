name: win-flakes2 diagnostics

on:
  push:
    branches: [win-flakes2]
    paths:
      - .github/workflows/win-flakes2.yml
      - crates/client/**
      - crates/engine/**
      - crates/rt/**
      - crates/sys/**

permissions:
  contents: read

concurrency:
  group: win-flakes2-diagnostics-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
  NEXTEST_PROFILE: windows
  MISE_AUTO_INSTALL: false

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        contention: [cpu]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: External build and evidence paths
        run: |
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/tgt-win-flakes2" >> $env:GITHUB_ENV
          "MBX_CACHE_DIR=$env:RUNNER_TEMP/mbx" >> $env:GITHUB_ENV
          "A_HOME=$env:RUNNER_TEMP/home-win-flakes2" >> $env:GITHUB_ENV
      - uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/mbx/actions
          key: win-flakes2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.contention }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/*.toml') }}-${{ github.sha }}
          restore-keys: |
            win-flakes2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.contention }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/*.toml') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-windows-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/*.toml') }}-
      - name: Install native LLVM toolchain
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.*)"').Matches.Groups[1].Value
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $toolchain = "$channel-$arch-pc-windows-msvc"
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
          rustup toolchain install $toolchain --profile minimal --component clippy,rust-src,rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: jdx/mise-action@v5
        with:
          install_args: mr-boxington
      - name: Install native nextest
        run: |
          $platform = if ($env:RUNNER_ARCH -eq 'ARM64') { 'windows-arm' } else { 'windows' }
          $archive = "$env:RUNNER_TEMP/nextest.zip"
          Invoke-WebRequest "https://get.nexte.st/0.9.148/$platform" -OutFile $archive
          Expand-Archive $archive -DestinationPath "$env:USERPROFILE/.cargo/bin" -Force
      - name: Repeat full parallel engine and client suites
        env:
          CONTENTION: ${{ matrix.contention }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $scratch = "$env:RUNNER_TEMP/evidence-win-flakes2"
          $config = "$env:RUNNER_TEMP/mise-win-flakes2"
          $contention = $env:CONTENTION
          $sha = $env:GITHUB_SHA
          New-Item -ItemType Directory -Force $scratch, $config | Out-Null
          # An external mise config prevents its dotenv directive from reading
          # local credentials, even before the test environment is sanitized.
          $mise = Get-Content "$root/mise.toml" -Raw
          $mise = [regex]::Replace($mise, '(?s)\[env\]\r?\n.*?(?=\[task_config\])', '')
          Set-Content "$config/mise.toml" $mise
          Copy-Item "$root/mise.lock", "$root/rust-toolchain.toml" $config
          $runners = @((Get-Command pwsh.exe).Source, "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe")
          # Keep only OS/tool discovery and the explicit isolated test settings.
          $keep = @('PATH','PATHEXT','SYSTEMROOT','WINDIR','COMSPEC','OS','PROCESSOR_ARCHITECTURE','PROCESSOR_IDENTIFIER','PROCESSOR_LEVEL','PROCESSOR_REVISION','NUMBER_OF_PROCESSORS','TEMP','TMP','USERPROFILE','HOME','HOMEDRIVE','HOMEPATH','APPDATA','LOCALAPPDATA','PROGRAMDATA','PROGRAMFILES','PROGRAMFILES(X86)','PROGRAMW6432','COMMONPROGRAMFILES','COMMONPROGRAMFILES(X86)','COMMONPROGRAMW6432','SYSTEMDRIVE','USERNAME','USERDOMAIN','RUSTUP_HOME','CARGO_HOME','RUSTUP_TOOLCHAIN','CARGO_TARGET_DIR','CARGO_BUILD_JOBS','CARGO_PROFILE_DEV_CODEGEN_BACKEND','MBX_CACHE_DIR','A_HOME','NEXTEST_PROFILE','MISE_AUTO_INSTALL')
          Get-ChildItem Env: | Where-Object { $_.Name.ToUpperInvariant() -notin $keep } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          $env:OPENAI_API_KEY = 'loopback-dummy'
          $env:OPENAI_BASE_URL = 'http://127.0.0.1:1/v1'
          $env:NO_PROXY = '127.0.0.1,localhost'
          $env:A_TEST_POWERSHELL = $runners -join ';'
          $env:CARGO_TERM_COLOR = 'never'
          $env:CI = 'true'
          & mise trust "$config/mise.toml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testArgs = @('--cd', $config, 'exec', '--', 'cargo', 'nextest', 'run', '--config', "$root/.cargo/config.toml", '--config', 'profile.dev.codegen-backend="llvm"', '--manifest-path', "$root/Cargo.toml", '-p', 'engine', '-p', 'client')
          "sha=$sha contention=$contention cores=$env:NUMBER_OF_PROCESSORS start=$([DateTime]::UtcNow.ToString('o'))" | Tee-Object "$scratch/run.txt"
          & mise @testArgs --no-run 2>&1 | Tee-Object "$scratch/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $spinners = @()
          $failed = 0
          try {
            if ($contention -eq 'cpu') {
              for ($worker = 0; $worker -lt [Environment]::ProcessorCount; $worker++) {
                $spinners += Start-Process pwsh -ArgumentList '-NoProfile', '-NonInteractive', '-Command', 'while ($true) { for ($i=0; $i -lt 100000; $i++) { [Math]::Sqrt($i) > $null } }' -PassThru -WindowStyle Hidden
              }
              "spinner_pids=$($spinners.Id -join ',')" | Add-Content "$scratch/run.txt"
            }
            for ($round = 1; $round -le 50; $round++) {
              $log = "$scratch/round-$round.log"
              "round=$round start=$([DateTime]::UtcNow.ToString('o'))" | Tee-Object -Append "$scratch/run.txt"
              & mise @testArgs --no-fail-fast --no-tests=fail 2>&1 | Tee-Object $log
              $code = $LASTEXITCODE
              "round=$round exit=$code end=$([DateTime]::UtcNow.ToString('o'))" | Tee-Object -Append "$scratch/run.txt"
              if ($code -ne 0) {
                $failed++
                Get-Process | Select-Object Id, ProcessName, CPU, StartTime | Format-Table -AutoSize | Out-String -Width 240 | Tee-Object "$scratch/processes-$round.txt"
                break
              }
            }
          } finally {
            foreach ($spinner in $spinners) { if (-not $spinner.HasExited) { Stop-Process -Id $spinner.Id } }
          }
          if ($failed -ne 0) { exit 1 }
      - name: Preserve timestamps and failure traces
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: win-flakes2-${{ matrix.os }}-${{ matrix.contention }}
          path: ${{ runner.temp }}/evidence-win-flakes2
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh
    env:
      NEXTEST_PROFILE: default
    steps:
      - uses: actions/checkout@v7
      - name: External build paths
        run: |
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/tgt-win-flakes2" >> $env:GITHUB_ENV
          "MBX_CACHE_DIR=$env:RUNNER_TEMP/mbx" >> $env:GITHUB_ENV
          "A_HOME=$env:RUNNER_TEMP/home-win-flakes2" >> $env:GITHUB_ENV
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington mold cargo:cargo-nextest
      - name: Native build dependencies
        shell: bash
        run: sudo apt-get install -y --no-install-recommends clang pkg-config libssl-dev
      - name: Repeat full parallel engine and client suites
        env:
          CONTENTION: cpu
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $scratch = "$env:RUNNER_TEMP/evidence-win-flakes2"
          $config = "$env:RUNNER_TEMP/mise-win-flakes2"
          $contention = $env:CONTENTION
          $sha = $env:GITHUB_SHA
          New-Item -ItemType Directory -Force $scratch, $config | Out-Null
          # An external mise config prevents its dotenv directive from reading
          # local credentials, even before the test environment is sanitized.
          $mise = Get-Content "$root/mise.toml" -Raw
          $mise = [regex]::Replace($mise, '(?s)\[env\]\r?\n.*?(?=\[task_config\])', '')
          Set-Content "$config/mise.toml" $mise
          Copy-Item "$root/mise.lock", "$root/rust-toolchain.toml" $config
          # Keep only OS/tool discovery and the explicit isolated test settings.
          $keep = @('TMPDIR','USER','LOGNAME','SHELL','PATH','PATHEXT','SYSTEMROOT','WINDIR','COMSPEC','OS','PROCESSOR_ARCHITECTURE','PROCESSOR_IDENTIFIER','PROCESSOR_LEVEL','PROCESSOR_REVISION','NUMBER_OF_PROCESSORS','TEMP','TMP','USERPROFILE','HOME','HOMEDRIVE','HOMEPATH','APPDATA','LOCALAPPDATA','PROGRAMDATA','PROGRAMFILES','PROGRAMFILES(X86)','PROGRAMW6432','COMMONPROGRAMFILES','COMMONPROGRAMFILES(X86)','COMMONPROGRAMW6432','SYSTEMDRIVE','USERNAME','USERDOMAIN','RUSTUP_HOME','CARGO_HOME','RUSTUP_TOOLCHAIN','CARGO_TARGET_DIR','CARGO_BUILD_JOBS','CARGO_PROFILE_DEV_CODEGEN_BACKEND','MBX_CACHE_DIR','A_HOME','NEXTEST_PROFILE','MISE_AUTO_INSTALL')
          Get-ChildItem Env: | Where-Object { $_.Name.ToUpperInvariant() -notin $keep } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          $env:OPENAI_API_KEY = 'loopback-dummy'
          $env:OPENAI_BASE_URL = 'http://127.0.0.1:1/v1'
          $env:NO_PROXY = '127.0.0.1,localhost'
          $env:CARGO_TERM_COLOR = 'never'
          $env:CI = 'true'
          & mise trust "$config/mise.toml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testArgs = @('--cd', $config, 'exec', '--', 'cargo', 'nextest', 'run', '--config', "$root/.cargo/config.toml", '--config', 'profile.dev.codegen-backend="llvm"', '--manifest-path', "$root/Cargo.toml", '-p', 'engine', '-p', 'client')
          "sha=$sha contention=$contention cores=$env:NUMBER_OF_PROCESSORS start=$([DateTime]::UtcNow.ToString('o'))" | Tee-Object "$scratch/run.txt"
          & mise @testArgs --no-run 2>&1 | Tee-Object "$scratch/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $spinners = @()
          $failed = 0
          try {
            if ($contention -eq 'cpu') {
              for ($worker = 0; $worker -lt [Environment]::ProcessorCount; $worker++) {
                $spinners += Start-Process pwsh -ArgumentList '-NoProfile', '-NonInteractive', '-Command', 'while ($true) { for ($i=0; $i -lt 100000; $i++) { [Math]::Sqrt($i) > $null } }' -PassThru
              }
              "spinner_pids=$($spinners.Id -join ',')" | Add-Content "$scratch/run.txt"
            }
            for ($round = 1; $round -le 50; $round++) {
              $log = "$scratch/round-$round.log"
              "round=$round start=$([DateTime]::UtcNow.ToString('o'))" | Tee-Object -Append "$scratch/run.txt"
              & mise @testArgs --no-fail-fast --no-tests=fail 2>&1 | Tee-Object $log
              $code = $LASTEXITCODE
              "round=$round exit=$code end=$([DateTime]::UtcNow.ToString('o'))" | Tee-Object -Append "$scratch/run.txt"
              if ($code -ne 0) {
                $failed++
                Get-Process | Select-Object Id, ProcessName, CPU, StartTime | Format-Table -AutoSize | Out-String -Width 240 | Tee-Object "$scratch/processes-$round.txt"
                break
              }
            }
          } finally {
            foreach ($spinner in $spinners) { if (-not $spinner.HasExited) { Stop-Process -Id $spinner.Id } }
          }
          if ($failed -ne 0) { exit 1 }
      - name: Preserve timestamps and failure traces
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: win-flakes2-ubuntu-latest-cpu
          path: ${{ runner.temp }}/evidence-win-flakes2
          retention-days: 14
