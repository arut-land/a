name: process native probe
on:
  workflow_dispatch:
concurrency:
  group: process-probe-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  musl:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
      MISE_AUTO_INSTALL: false
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-nextest mold
      - run: sudo apt-get update && sudo apt-get install -y musl-tools busybox-static
      - run: mise exec -- rustup target add x86_64-unknown-linux-musl
      - run: mise exec -- cargo nextest run -p sys --target x86_64-unknown-linux-musl --no-fail-fast
      - name: Spawn with no procfs mounted
        if: always()
        shell: bash
        run: |
          probe_root=$(mktemp -d)
          mkdir -p "$probe_root/bin" "$probe_root/dev"
          cp /bin/busybox "$probe_root/bin/sh"
          sudo mknod "$probe_root/dev/null" c 1 3
          mise exec -- cargo test -p sys --target x86_64-unknown-linux-musl --lib --no-run --message-format=json > "$RUNNER_TEMP/sys-artifacts.jsonl"
          python3 - "$RUNNER_TEMP/sys-artifacts.jsonl" "$probe_root/sys-tests" <<'PYTHON'
          import json, shutil, sys
          for line in open(sys.argv[1]):
              value = json.loads(line)
              if value.get('reason') == 'compiler-artifact' and value.get('executable'):
                  shutil.copy2(value['executable'], sys.argv[2])
          PYTHON
          sudo chroot "$probe_root" /sys-tests --exact proc::unix::linux::tests::musl_plans_close_unlisted_fds_and_return_native_exec_failures
