name: process native probe
on:
  push:
    branches: [codex-w1process]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  musl:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
      MISE_AUTO_INSTALL: false
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-nextest mold
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: mise exec -- rustup target add x86_64-unknown-linux-musl
      - run: mise exec -- cargo clippy -p sys --all-targets --target x86_64-unknown-linux-musl -- -D warnings
      - run: mise exec -- cargo nextest run -p sys --target x86_64-unknown-linux-musl --no-fail-fast
