name: resources probe
on:
  workflow_dispatch:
  push:
    branches: [codex-w5rt]
    paths: [crates/rt/**, crates/sys/**, .github/workflows/resources-probe.yml]
concurrency:
  group: resources-probe-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
      RUSTUP_TOOLCHAIN: nightly-2026-10-17
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold clang
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: cargo test -p sys resources::tests && cargo test -p rt --lib -- --test-threads=1
      - run: cargo run --release -p rt --example resources | tee resources.txt
      - run: cargo run --release -p rt --example resources --features resource-allocations | tee -a resources.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: resources-${{ matrix.runner }}
          path: resources.txt
