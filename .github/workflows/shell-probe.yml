name: shell startup probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - shell: pwsh
        run: |
          @'
          import os, pathlib, subprocess, tempfile
          shells = [r'C:\Program Files\PowerShell\7\pwsh.exe', os.path.join(os.environ['SystemRoot'], r'System32\WindowsPowerShell\v1.0\powershell.exe')]
          directory = tempfile.mkdtemp(prefix='a-shell-startup-')
          for shell in shells:
              for extended_exe in [False, True]:
                  for extended_cwd in [False, True]:
                      executable = ('\\\\?\\' if extended_exe else '') + shell
                      cwd = ('\\\\?\\' if extended_cwd else '') + directory
                      result = subprocess.run([executable, '-NoLogo', '-NoProfile', '-NonInteractive', '-Command', 'Write-Output $PSVersionTable.PSVersion.ToString(); exit 37'], cwd=cwd, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=20)
                      print(shell, 'extended_exe=', extended_exe, 'extended_cwd=', extended_cwd, 'exit=', result.returncode, 'output=', result.stdout.decode('utf-8', errors='replace'), flush=True)
          os.rmdir(directory)
          '@ | python -
