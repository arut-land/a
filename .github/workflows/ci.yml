name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bloat_refs:
        description: 'JSON array of revisions for Linux fixtures size and cargo-bloat'
        default: '[]'
        type: string
      bloat_only:
        description: 'Measure revisions without running the validation lanes'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.bloat_refs || 'check' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  # Each job installs its own tools; task execution must not install the rest.
  MISE_AUTO_INSTALL: false

jobs:
  check:
    if: ${{ !inputs.bloat_only }}
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon and x86_64 Linux.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # mbx (the cargo wrapper in mise.toml) keeps compiled crates in its own
      # store; caching that store and the toolchain is what makes reruns fast.
      - &mbx-dir
        shell: bash
        run: echo "MBX_CACHE_DIR=$RUNNER_TEMP/mbx" >> "$GITHUB_ENV"
      - &cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/mbx/actions
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/*.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - &mise
        uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-nextest ${{ runner.os == 'Linux' && 'mold' || '' }}
      # The no-polling acceptance test traces the client's syscalls.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends clang pkg-config libssl-dev strace
      # fmt, clippy -D warnings, then every test: unit, llm parity, and the
      # black-box M1 acceptance tests in apps/cli/tests/blackbox (budgets run
      # with CI slack). Live-model tests stay #[ignore]d; there are no secrets.
      - run: mise run check
      # The Windows build, cross-linted: no platform cfg above `sys`/`rt`.
      - if: runner.os == 'Linux'
        run: mise run check:windows

  budgets:
    if: ${{ !inputs.bloat_only }}
    name: budgets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            strict: 0
          # Latency is held to the design's budgets on one lane.
          - os: ubuntu-latest
            strict: 1
    runs-on: ${{ matrix.os }}
    env:
      A_STRICT_BUDGETS: ${{ matrix.strict }}
    steps:
      - uses: actions/checkout@v7
      - *mbx-dir
      - *cache
      - *mise
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends clang pkg-config libssl-dev
      # Idle daemon RSS (10 MiB) and the size cap (4 MiB) are held exactly;
      # cold start and attach latency too where strict, else with slack.
      - run: mise run budgets
      # The shipped binary's size as a number to compare: this run's against
      # the last one on main, warned about past 16 KiB (the cap stays the
      # gate). Apple silicon is the reference lane; the other skips the
      # second release link.
      - if: runner.os == 'macOS'
        run: mise run size | grep -o 'a:.*KiB' | tee size.txt
      - if: runner.os == 'macOS'
        uses: actions/cache/restore@v6
        with:
          path: main-size.txt
          key: size-main-${{ github.sha }}
          restore-keys: size-main-
      - if: runner.os == 'macOS'
        run: |
          now=$(grep -o '[0-9]* KiB' size.txt | head -1 | cut -d' ' -f1)
          if [[ -f main-size.txt ]]; then
            was=$(grep -o '[0-9]* KiB' main-size.txt | head -1 | cut -d' ' -f1)
            echo "a: $now KiB; main: $was KiB; delta: $((now - was)) KiB" | tee -a "$GITHUB_STEP_SUMMARY"
            ((now - was <= 16)) || echo "::warning::a grew $((now - was)) KiB over main ($was -> $now KiB)"
          fi
          cp size.txt main-size.txt
      - if: runner.os == 'macOS' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: main-size.txt
          key: size-main-${{ github.sha }}
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: size
          path: size.txt

  deny:
    if: ${{ !inputs.bloat_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-deny
      - run: mise run deny

  machete:
    if: ${{ !inputs.bloat_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-machete
      - run: mise run machete

  # Nothing `a` builds depends on tokio.
  no-tokio:
    if: ${{ !inputs.bloat_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington
      - run: mise run check:no-tokio

  # Coverage-guided fuzzing of the framer, the JSON decoders and the view
  # reducer, briefly: a regression gate, not a campaign.
  fuzz:
    if: ${{ !inputs.bloat_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *mbx-dir
      - *cache
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington mold cargo:cargo-bolero
      - run: mise run fuzz --time 30s
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-crashes
          path: crates/protocol/tests/__fuzz__/*/crashes

  miri:
    if: ${{ !inputs.bloat_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *mbx-dir
      - *cache
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington mold
      - run: mise run test:miri

  windows:
    if: ${{ !inputs.bloat_only }}
    runs-on: windows-latest
    env:
      # Session panic isolation and the test harness require unwinding;
      # Cranelift does not support it on Windows.
      CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
      NEXTEST_PROFILE: windows
    defaults:
      run:
        shell: bash
    # Native completion, security, job containment, and daemon acceptance.
    steps:
      # Recorded wire/provider fixtures must keep their checked-in bytes.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - *mbx-dir
      - *cache
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-nextest
      - run: mise exec -- cargo clippy --workspace --all-targets --features a/lua -- -D warnings
      - run: mise exec -- cargo build -p a
      - run: mise exec -- cargo nextest run --workspace --no-tests=fail --no-fail-fast
      - run: mise run acceptance

  # The macOS app: the FFI package (boltffi pack apple --deny-skipped), the
  # reducer vectors and a live session through it in Swift, then the app
  # built headless with xcodebuild.
  apple:
    if: ${{ !inputs.bloat_only }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - *mbx-dir
      - *cache
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington github:boltffi/boltffi aqua:yonaskolb/XcodeGen
      - run: mise run apple:test
      - run: mise run apple:build

  context-bloat:
    if: ${{ inputs.bloat_refs && inputs.bloat_refs != '[]' }}
    name: context bloat (${{ matrix.ref }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(inputs.bloat_refs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - *mbx-dir
      - *cache
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington mold cargo:cargo-bloat
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang pkg-config libssl-dev
      - name: Measure the shipped fixtures binary and its text
        env:
          MEASURE_REF: ${{ matrix.ref }}
        run: |
          mkdir -p measurements
          git rev-parse HEAD > measurements/revision.txt
          mise exec -- cargo build-release -p a --features fixtures
          wc -c < target/release/a > measurements/bytes.txt
          mise exec -- cargo bloat --release -p a --features fixtures -Z build-std=std,panic_unwind -Z build-std-features=panic-unwind,optimize_for_size --config profile.release.strip=false --message-format json --crates -n 0 > measurements/crates.json
          mise exec -- cargo bloat --release -p a --features fixtures -Z build-std=std,panic_unwind -Z build-std-features=panic-unwind,optimize_for_size --config profile.release.strip=false --message-format json --filter 'protocol::publication|engine::transcript' -n 0 > measurements/symbols.json
          echo "$MEASURE_REF: $(cat measurements/bytes.txt) bytes" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: context-bloat-${{ matrix.ref }}
          path: measurements/
