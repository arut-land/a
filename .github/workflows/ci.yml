name: CI
on: workflow_dispatch
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
jobs:
  linux-chroot-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-nextest
      - run: mise exec -- cargo nextest run -p sys -E 'test(staging_works_with_tmpfile_but_without_procfs_or_link_capability)' --no-tests=fail
