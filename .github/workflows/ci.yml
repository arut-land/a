name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  MISE_AUTO_INSTALL: false
  CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
  A_TEST_PROCESS_TRACE: 1
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - run: echo "MBX_CACHE_DIR=$RUNNER_TEMP/mbx" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/mbx/actions
          key: cargo-${{ runner.os }}-windows-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/*.toml') }}
          restore-keys: cargo-${{ runner.os }}-windows-
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington
      - run: mise exec -- cargo build -p a
      - shell: pwsh
        run: |
          $systemTemp = [IO.Path]::GetTempPath()
          Write-Host "OS temp=$systemTemp scratch=$env:RUNNER_TEMP"
          $exe = (Resolve-Path 'target/debug/a.exe').Path
          & $exe --version
          $workerScript = Join-Path $env:RUNNER_TEMP 'a-io-worker.ps1'
          @'
          param([string]$loadPath)
          $bytes = New-Object byte[] (64 * 1024 * 1024)
          [Random]::new(1).NextBytes($bytes)
          $file = [IO.File]::Open($loadPath, [IO.FileMode]::CreateNew)
          try {
            while ($true) {
              $file.Position = 0
              $file.Write($bytes, 0, $bytes.Length)
              $file.Flush($true)
            }
          } finally { $file.Dispose() }
          '@ | Set-Content $workerScript
          $workers = @()
          $probes = @()
          $previousHome = $env:A_HOME
          try {
            foreach ($worker in 1..4) {
              $loadPath = Join-Path $systemTemp ('a-io-load-' + [guid]::NewGuid())
              $process = Start-Process pwsh -NoNewWindow -PassThru -ArgumentList '-NoProfile', '-File', $workerScript, $loadPath
              $workers += @{ Process = $process; Path = $loadPath }
            }
            $ready = [Diagnostics.Stopwatch]::StartNew()
            while (@($workers | Where-Object { -not (Test-Path $_.Path) -or (Get-Item $_.Path).Length -lt 67108864 }).Count -gt 0) {
              if ($ready.Elapsed.TotalSeconds -gt 30) { throw 'I/O workers never became ready' }
              Start-Sleep -Milliseconds 20
            }
            foreach ($location in @($systemTemp, $env:RUNNER_TEMP)) {
              $wave = @()
              foreach ($client in 1..4) {
                $probeRoot = Join-Path $location ('a-io-probe-' + [guid]::NewGuid())
                New-Item -ItemType Directory $probeRoot | Out-Null
                $env:A_HOME = $probeRoot
                $errorFile = Join-Path $probeRoot 'stderr'
                $process = Start-Process $exe -ArgumentList 'ls' -NoNewWindow -PassThru -RedirectStandardOutput (Join-Path $probeRoot 'stdout') -RedirectStandardError $errorFile
                $probe = @{ Process = $process; Home = $probeRoot; ErrorFile = $errorFile }
                $wave += $probe
                $probes += $probe
              }
              $clock = [Diagnostics.Stopwatch]::StartNew()
              foreach ($probe in $wave) {
                $remaining = [Math]::Max(0, 30000 - [int]$clock.Elapsed.TotalMilliseconds)
                $completed = $probe.Process.WaitForExit($remaining)
                Write-Host "collection pid=$($probe.Process.Id) home=$($probe.Home) completedWithin30s=$completed elapsed=$($clock.Elapsed.TotalMilliseconds) ms"
                if (-not $completed) { $probe.Process.Kill() }
                if ($probe.Process.WaitForExit(1000)) { $probe.Process.WaitForExit() }
                Get-Content $probe.ErrorFile
              }
            }
          } finally {
            foreach ($worker in $workers) {
              if (-not $worker.Process.HasExited) { $worker.Process.Kill() }
            }
            foreach ($worker in $workers) {
              $worker.Process.WaitForExit()
              Remove-Item $worker.Path -Force -ErrorAction Continue
            }
            foreach ($probe in $probes) {
              if (-not $probe.Process.HasExited) { $probe.Process.Kill() }
              $probe.Process.WaitForExit()
              $env:A_HOME = $probe.Home
              if (Test-Path (Join-Path $probe.Home 'run/daemon.pid')) { & $exe daemon stop }
              $cleanup = [Diagnostics.Stopwatch]::StartNew()
              while (Test-Path $probe.Home) {
                try { Remove-Item $probe.Home -Recurse -Force -ErrorAction Stop }
                catch {
                  if ($cleanup.Elapsed.TotalSeconds -gt 30) { throw }
                  Start-Sleep -Milliseconds 20
                }
              }
            }
            $env:A_HOME = $previousHome
            Remove-Item $workerScript
          }
