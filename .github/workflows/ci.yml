name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon and x86_64 Linux.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # mbx (the cargo wrapper in mise.toml) keeps compiled crates in its own
      # store; caching that store and the toolchain is what makes reruns fast.
      - &mbx-dir
        shell: bash
        run: echo "MBX_CACHE_DIR=$RUNNER_TEMP/mbx" >> "$GITHUB_ENV"
      - &cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/mbx/actions
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/*.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - &mise
        uses: jdx/mise-action@v5
      # The no-polling acceptance test traces the client's syscalls.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends strace
      # fmt, clippy -D warnings, then every test: unit, llm parity, and the
      # black-box M1 acceptance and budget tests in apps/cli/tests (budgets
      # with CI slack). Live-model tests stay #[ignore]d; there are no secrets.
      - run: mise run check

  budgets:
    name: budgets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            strict: 0
          # Latency is held to the design's budgets on one lane.
          - os: ubuntu-latest
            strict: 1
    runs-on: ${{ matrix.os }}
    env:
      A_STRICT_BUDGETS: ${{ matrix.strict }}
    steps:
      - uses: actions/checkout@v7
      - *mbx-dir
      - *cache
      - *mise
      # Release size (4 MiB) and idle daemon RSS (10 MiB) are held exactly;
      # cold start and attach latency too where strict, else with slack.
      - run: mise run budgets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *mise
      - run: mise run deny

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *mise
      - run: mise run machete

  # No core crate depends on tokio; only the web UI does, through topcoat.
  no-tokio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *mise
      - run: mise run check:no-tokio

  # Coverage-guided fuzzing of the framer, the JSON decoders and the view
  # reducer, briefly: a regression gate, not a campaign.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *mbx-dir
      - *cache
      - *mise
      - run: mise run fuzz --time 30s
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-crashes
          path: crates/protocol/tests/__fuzz__/*/crashes

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *mbx-dir
      - *cache
      - *mise
      - run: mise run test:miri

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    # The daemon and its transports are Unix only for now, so `engine` and
    # the `a` CLI (which links it) are built rather than linted: their
    # serving code is dead here. `a` runs its line REPL, which reports that.
    env:
      PORTABLE: -p sys -p rt -p protocol -p store -p agent -p llm -p client -p tui
    steps:
      - uses: actions/checkout@v7
      - *mbx-dir
      - *cache
      - *mise
      - run: mise exec -- cargo clippy $PORTABLE --all-targets -- -D warnings
      - run: mise exec -- cargo build -p engine -p a
      - name: test (advisory until first green on Windows)
        continue-on-error: true
        run: mise exec -- cargo nextest run $PORTABLE --no-tests=pass

  # The macOS app: the FFI package (boltffi pack apple --deny-skipped), the
  # reducer vectors and a live session through it in Swift, then the app
  # built headless with xcodebuild.
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - *mbx-dir
      - *cache
      - *mise
      - run: mise run apple:test
      - run: mise run apple:build
