name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  # Each job installs its own tools; task execution must not install the rest.
  MISE_AUTO_INSTALL: false

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon and x86_64 Linux. Branch runs skip macOS: it is
        # verified locally on Apple silicon, and its runners are scarce.
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && '["macos-latest","ubuntu-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # mbx (the cargo wrapper in mise.toml) keeps compiled crates in its own
      # store; caching that store and the toolchain is what makes reruns fast.
      - &mbx-dir
        shell: bash
        run: echo "MBX_CACHE_DIR=$RUNNER_TEMP/mbx" >> "$GITHUB_ENV"
      - &cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/mbx/actions
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/*.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/*.toml') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - &mise
        uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-nextest ${{ runner.os == 'Linux' && 'mold' || '' }}
      # The no-polling acceptance test traces the client's syscalls.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends clang pkg-config libssl-dev strace
      # Use the image's Chrome and Node; install only the pinned browser driver.
      # This also prepares the browser for the un-ignored test in the full suite.
      - name: Web browser regression
        run: mise run test:web
      # fmt, clippy -D warnings, then every test: unit, llm parity, and the
      # black-box M1 acceptance tests in apps/cli/tests/blackbox. The
      # release budgets run in their own jobs. Live-model tests stay
      # #[ignore]d; there are no secrets.
      - run: mise run check
      - &transport-features
        name: Transport without TLS and with rustls
        run: |
          for feature in client tls-rustls; do
            mise exec -- cargo clippy -p transport --all-targets --features "$feature" -- -D warnings
            mise exec -- cargo nextest run -p transport --features "$feature" --no-tests=fail
          done
      # The Windows build, cross-linted: no platform cfg above `sys`/`rt`.
      - if: runner.os == 'Linux'
        run: mise run check:windows

  budgets:
    name: budgets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Latency is held to the design's budgets on one lane (strict);
        # macOS on main only, as for check.
        include: ${{ fromJSON(github.ref == 'refs/heads/main' && '[{"os":"macos-latest","strict":0},{"os":"ubuntu-latest","strict":1}]' || '[{"os":"ubuntu-latest","strict":1}]') }}
    runs-on: ${{ matrix.os }}
    env:
      A_STRICT_BUDGETS: ${{ matrix.strict }}
    steps:
      - uses: actions/checkout@v7
      - *mbx-dir
      - *cache
      - *mise
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends clang pkg-config libssl-dev
      # Idle daemon charged memory (10 MiB) is held exactly; cold start and attach
      # latency too where strict, else with slack.
      - run: mise run budgets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-deny
      - run: mise run deny

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-machete
      - run: mise run machete

  threads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          python3 -m unittest discover -s scripts/check -p 'test_*.py'
          python3 scripts/check/threads.py

  # Nothing `a` builds depends on tokio.
  no-tokio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington
      - run: mise run check:no-tokio

  # Coverage-guided fuzzing of the framer, the JSON decoders and the view
  # reducer, briefly: a regression gate, not a campaign.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *mbx-dir
      - *cache
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington mold cargo:cargo-bolero
      - run: mise run fuzz --time 30s
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-crashes
          path: |
            crates/protocol/tests/__fuzz__/*/crashes
            crates/ext-skills/src/parse/__fuzz__/*/crashes

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *mbx-dir
      - *cache
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington mold
      - run: mise run test:miri

  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      # Session panic isolation and the test harness require unwinding;
      # Cranelift does not support it on Windows.
      CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
      NEXTEST_PROFILE: windows
    defaults:
      run:
        shell: bash
    # Native completion, security, job containment, and daemon acceptance.
    steps:
      # Recorded wire/provider fixtures must keep their checked-in bytes.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - *mbx-dir
      - *cache
      - name: Install native LLVM toolchain
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.*)"').Matches.Groups[1].Value
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $toolchain = "$channel-$arch-pc-windows-msvc"
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
          rustup toolchain install $toolchain --profile minimal --component clippy,rust-src,rustfmt
      - uses: jdx/mise-action@v5
        with:
          install_args: mr-boxington
      - name: Install native nextest
        shell: pwsh
        run: |
          $platform = if ($env:RUNNER_ARCH -eq 'ARM64') { 'windows-arm' } else { 'windows' }
          $archive = "$env:RUNNER_TEMP/nextest.zip"
          Invoke-WebRequest "https://get.nexte.st/0.9.148/$platform" -OutFile $archive
          Expand-Archive $archive -DestinationPath "$env:USERPROFILE/.cargo/bin" -Force
      - name: Select native PowerShell contract runners
        shell: pwsh
        run: |
          $runners = @((Get-Command pwsh.exe).Source, "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe")
          "A_TEST_POWERSHELL=$($runners -join ';')" >> $env:GITHUB_ENV
      - run: mise run check:clippy
      - run: mise exec -- cargo build -p a
      - run: mise run test
      - *transport-features

  # The macOS app: the FFI package (boltffi pack apple --deny-skipped), the
  # reducer vectors and a live session through it in Swift, then the app
  # built headless with xcodebuild.
  apple:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - *mbx-dir
      - *cache
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington github:boltffi/boltffi aqua:yonaskolb/XcodeGen
      - run: mise run --jobs 1 apple:check
