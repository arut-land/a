name: Windows retirement probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
  MISE_NO_ENV: 1
  MISE_AUTO_INSTALL: false

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install native LLVM toolchain
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.*)"').Matches.Groups[1].Value
          $toolchain = "$channel-x86_64-pc-windows-msvc"
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
          rustup toolchain install $toolchain --profile minimal --component clippy,rust-src,rustfmt
      - uses: jdx/mise-action@v5
        with:
          install_args: mr-boxington
      - name: Compare pristine and controlled handle lifetimes
        shell: pwsh
        run: |
          @'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          root = Path(os.environ["RUNNER_TEMP"])
          evidence = root / "retirement-evidence"
          evidence.mkdir(exist_ok=True)
          keep = {"PATH", "PATHEXT", "HOME", "USERPROFILE", "APPDATA", "LOCALAPPDATA", "PROGRAMDATA", "PROGRAMFILES", "PROGRAMFILES(X86)", "COMMONPROGRAMFILES", "COMMONPROGRAMFILES(X86)", "SYSTEMROOT", "SYSTEMDRIVE", "WINDIR", "COMSPEC", "TMP", "TEMP", "RUSTUP_HOME", "CARGO_HOME", "RUSTUP_TOOLCHAIN", "PROCESSOR_ARCHITECTURE", "NUMBER_OF_PROCESSORS", "LIB", "INCLUDE", "LIBPATH", "VSINSTALLDIR", "VCINSTALLDIR", "VCTOOLSINSTALLDIR", "WINDOWSSDKDIR", "WINDOWSSDKVERSION"}
          clean = {k: v for k, v in os.environ.items() if k.upper() in keep}
          clean.update(MISE_TRUSTED_CONFIG_PATHS=str(Path.cwd()), MISE_YES="1", MISE_NO_ENV="1", MISE_AUTO_INSTALL="false", CARGO_BUILD_JOBS="2", CARGO_PROFILE_DEV_CODEGEN_BACKEND="llvm", CARGO_TARGET_DIR=str(root / "tgt-small-fixes"), MBX_CACHE_DIR=str(root / "mbx"), A_HOME=str(root / "retirement-home"), OPENAI_API_KEY="loopback-dummy", OPENAI_BASE_URL="http://127.0.0.1:1/v1", ANTHROPIC_API_KEY="loopback-dummy", ANTHROPIC_BASE_URL="http://127.0.0.1:1", NO_PROXY="127.0.0.1,localhost")
          source = Path("crates/sys/src/runtime/image.rs")
          probed = source.read_bytes()
          pristine = subprocess.check_output(["git", "show", "c6e1b87f:crates/sys/src/runtime/image.rs"], env=clean)

          def build(label):
              result = subprocess.run(["mise", "exec", "--", "cargo", "test", "-p", "sys", "--lib", "--no-run", "--message-format=json"], env=clean, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, encoding="utf-8", errors="replace")
              (evidence / f"build-{label}.log").write_text(result.stdout)
              if result.returncode:
                  print(result.stdout, flush=True)
                  raise SystemExit(result.returncode)
              for line in result.stdout.splitlines():
                  try:
                      item = json.loads(line)
                  except ValueError:
                      continue
                  if item.get("reason") == "compiler-artifact" and item.get("executable") and item["target"]["name"] == "sys":
                      target = root / f"sys-{label}.exe"
                      shutil.copyfile(item["executable"], target)
                      return str(target)
              raise RuntimeError("sys test executable missing from Cargo metadata")

          try:
              source.write_bytes(pristine)
              original_exe = build("pristine")
          finally:
              source.write_bytes(probed)
          probe_exe = build("probe")
          name = "runtime::image::tests::retiring_a_running_image_allows_updates_and_reclamation_after_exit"
          modes = ["pristine", "held", "dropped", "duplicate", "thread"]
          counts = {mode: {"passed": 0, "failed": 0} for mode in modes}
          for round_number in range(1, 201):
              order = modes if round_number % 2 else list(reversed(modes))
              for mode in order:
                  env = dict(clean)
                  if mode != "pristine":
                      env["A_TEST_IMAGE_HANDLE_PROBE"] = mode
                  result = subprocess.run([original_exe if mode == "pristine" else probe_exe, "--exact", name, "--nocapture"], env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, encoding="utf-8", errors="replace")
                  (evidence / f"{round_number:03d}-{mode}.log").write_text(result.stdout)
                  counts[mode]["passed" if result.returncode == 0 else "failed"] += 1
                  if result.returncode and counts[mode]["failed"] <= 3:
                      print(f"round={round_number} mode={mode}\n{result.stdout}", flush=True)
              if round_number % 25 == 0:
                  print(json.dumps({"rounds": round_number, "counts": counts}), flush=True)
          (evidence / "summary.json").write_text(json.dumps({"rounds": 200, "counts": counts}, indent=2))
          print(json.dumps(counts), flush=True)
          '@ | Set-Content "$env:RUNNER_TEMP/retirement-probe.py"
          python "$env:RUNNER_TEMP/retirement-probe.py"
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: retirement-evidence
          path: ${{ runner.temp }}/retirement-evidence
