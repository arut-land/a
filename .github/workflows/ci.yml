name: CI
on:
  workflow_dispatch:
    inputs:
      runner:
        type: string
        default: windows-latest
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  MISE_AUTO_INSTALL: false
jobs:
  windows-publication:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-nextest
      - run: mise exec -- cargo nextest run -p sys -p ext-edit -E 'test(fs::edit::tests) | package(ext-edit)' --no-tests=fail --no-fail-fast
