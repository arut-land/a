name: Windows retirement probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
  MISE_NO_ENV: 1
  MISE_AUTO_INSTALL: false

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install native LLVM toolchain
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.*)"').Matches.Groups[1].Value
          $toolchain = "$channel-x86_64-pc-windows-msvc"
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
          rustup toolchain install $toolchain --profile minimal --component clippy,rust-src,rustfmt
      - uses: jdx/mise-action@v5
        with:
          install_args: mr-boxington
      - name: Install native nextest
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/nextest.zip"
          Invoke-WebRequest "https://get.nexte.st/0.9.148/windows" -OutFile $archive
          Expand-Archive $archive -DestinationPath "$env:USERPROFILE/.cargo/bin" -Force
      - name: Compare handle lifetimes under the CI nextest runner
        shell: pwsh
        run: |
          @'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          root = Path(os.environ["RUNNER_TEMP"])
          evidence = root / "retirement-evidence"
          evidence.mkdir(exist_ok=True)
          keep = {"PATH", "PATHEXT", "HOME", "USERPROFILE", "APPDATA", "LOCALAPPDATA", "PROGRAMDATA", "PROGRAMFILES", "PROGRAMFILES(X86)", "COMMONPROGRAMFILES", "COMMONPROGRAMFILES(X86)", "SYSTEMROOT", "SYSTEMDRIVE", "WINDIR", "COMSPEC", "TMP", "TEMP", "RUSTUP_HOME", "CARGO_HOME", "RUSTUP_TOOLCHAIN", "PROCESSOR_ARCHITECTURE", "NUMBER_OF_PROCESSORS", "LIB", "INCLUDE", "LIBPATH", "VSINSTALLDIR", "VCINSTALLDIR", "VCTOOLSINSTALLDIR", "WINDOWSSDKDIR", "WINDOWSSDKVERSION"}
          clean = {k: v for k, v in os.environ.items() if k.upper() in keep}
          clean.update(NEXTEST_PROFILE="windows", MISE_TRUSTED_CONFIG_PATHS=str(Path.cwd()), MISE_YES="1", MISE_NO_ENV="1", MISE_AUTO_INSTALL="false", CARGO_BUILD_JOBS="2", CARGO_PROFILE_DEV_CODEGEN_BACKEND="llvm", CARGO_TARGET_DIR=str(root / "tgt-small-fixes"), MBX_CACHE_DIR=str(root / "mbx"), A_HOME=str(root / "retirement-home"), OPENAI_API_KEY="loopback-dummy", OPENAI_BASE_URL="http://127.0.0.1:1/v1", ANTHROPIC_API_KEY="loopback-dummy", ANTHROPIC_BASE_URL="http://127.0.0.1:1", NO_PROXY="127.0.0.1,localhost")
          source = Path("crates/sys/src/runtime/image.rs")
          probed = source.read_bytes()
          pristine = subprocess.check_output(["git", "show", "c6e1b87f:crates/sys/src/runtime/image.rs"], env=clean)

          def run_stress(label, count, mode=None):
              env = dict(clean)
              if mode is not None:
                  env["A_TEST_IMAGE_HANDLE_PROBE"] = mode
              command = ["mise", "exec", "--", "cargo", "nextest", "run", "-p", "sys", "--features", "test-support", "-E", "test(=runtime::image::tests::retiring_a_running_image_allows_updates_and_reclamation_after_exit)", "--stress-count", str(count), "--no-fail-fast", "--success-output", "immediate", "--failure-output", "immediate"]
              result = subprocess.run(command, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, encoding="utf-8", errors="replace")
              (evidence / f"{label}.log").write_text(result.stdout)
              summaries = [line for line in result.stdout.splitlines() if "Summary" in line or "stress run iterations" in line]
              print(json.dumps({"label": label, "returncode": result.returncode, "summaries": summaries}), flush=True)
              return {"returncode": result.returncode, "summaries": summaries}

          results = {}
          try:
              source.write_bytes(pristine)
              results["pristine"] = run_stress("pristine", 1000)
          finally:
              source.write_bytes(probed)
          for mode in ["held", "dropped", "duplicate", "thread", "file", "file-dropped", "posix-file"]:
              results[mode] = run_stress(mode, 200, mode)
          (evidence / "summary.json").write_text(json.dumps(results, indent=2))
          print(json.dumps(results), flush=True)
          '@ | Set-Content "$env:RUNNER_TEMP/retirement-probe.py"
          python "$env:RUNNER_TEMP/retirement-probe.py"
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: retirement-evidence
          path: ${{ runner.temp }}/retirement-evidence
