name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  review-red-windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
      NEXTEST_PROFILE: windows
      MISE_AUTO_INSTALL: false
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-nextest
      - run: |
          set +e
          mise exec -- cargo nextest run -p sys --no-fail-fast -E 'test(alternate_stream_bytes_are_part) | test(cancellation_during_an_alternate_stream_copy)' 2>&1 | tee red.log
          status=${PIPESTATUS[0]}
          test "$status" = 100
          rg '2 failed' red.log
