name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  MISE_AUTO_INSTALL: false
jobs:
  windows-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-nextest
      - name: Run the POSIX replacement fixture against the old publication code
        shell: bash
        run: |
          python - <<'PYPROBE'
          from pathlib import Path
          import subprocess
          path=Path('crates/sys/src/fs/edit.rs')
          current=path.read_text()
          old=subprocess.check_output(['git','show','cd615fa7:crates/sys/src/fs/edit.rs'],text=True)
          start='    #[test]\n    fn replacement_in_the_final_window_is_never_overwritten_without_exchange()'
          end='    #[cfg(unix)]\n    #[test]\n    fn metadata_changes_in_the_final_window_are_restored()'
          fixture=current[current.index(start):current.index(end,current.index(start))]
          path.write_text(old[:old.index(start)]+fixture+old[old.index(end,old.index(start)):])
          # Keep the old staging API as well; the only adaptation is the native test fixture.
          staging=subprocess.check_output(['git','show','cd615fa7:crates/sys/src/fs/staging.rs'],text=True)
          Path('crates/sys/src/fs/staging.rs').write_text(staging)
          PYPROBE
          mise exec -- cargo nextest run -p sys -E 'test(replacement_in_the_final_window_is_never_overwritten_without_exchange)' --no-tests=fail
