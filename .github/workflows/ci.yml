name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  MISE_AUTO_INSTALL: false
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-nextest ${{ runner.os == 'Linux' && 'mold' || '' }}
      - run: mise exec -- cargo nextest run -p sys -E 'test(replacement_in_the_final_window_is_never_overwritten_without_exchange) | test(metadata_changes_in_the_final_window_are_restored) | test(xattr_names_and_values_share_the_transaction_byte_limit) | test(cancellation_between_xattrs_reclaims_staging_without_publication)' --no-fail-fast --no-tests=fail
