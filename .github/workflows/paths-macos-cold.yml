name: paths macos cold
on:
  workflow_dispatch:
  push:
    branches: [codex-w2paths]
    paths: [.github/workflows/paths-macos-cold.yml, scripts/perf/paths-macos-cold.py]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 4
jobs:
  cold:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install native LLVM toolchain
        run: |
          python3 - <<'PY'
          import os, tomllib
          channel = tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel']
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RUSTUP_TOOLCHAIN={channel}-x86_64-apple-darwin\n')
          PY
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src
      - run: python3 -m pip install --break-system-packages psutil==7.2.2
      - run: python3 scripts/perf/paths-macos-cold.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: paths-macos-cold-intel
          path: target/paths-macos-cold/*.json
