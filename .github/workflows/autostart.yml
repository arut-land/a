# Autostart's lifetime handshake against each OS's real service manager
# (scripts/autostart/hosted.py). It registers with the runner's own user
# manager, so it runs only on disposable hosted runners: weekly and on demand.
name: autostart
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 4
      MISE_AUTO_INSTALL: false
      CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang pkg-config libssl-dev
      - if: runner.os == 'Linux'
        uses: jdx/mise-action@v5
        with:
          install_args: mold
      - if: runner.os == 'Linux'
        name: Use native Cargo without the optional mise wrapper
        run: echo "$(dirname "$(rustup which cargo)")" >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        name: Install native toolchain
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.*)"').Matches.Groups[1].Value
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $toolchain = "$channel-$arch-pc-windows-msvc"
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
          rustup toolchain install $toolchain --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p a
      - if: runner.os == 'Linux'
        name: User manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/autostart/hosted.py target/release/a${{ runner.os == 'Windows' && '.exe' || '' }}
      - if: failure() && runner.os == 'Linux'
        run: journalctl --user -u 'a-daemon-*.service' --no-pager -n 150
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: autostart-${{ matrix.runner }}
          path: autostart-result.json
