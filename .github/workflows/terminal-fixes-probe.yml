name: terminal fixes probe
on:
  push:
    branches: [codex-w3term]
permissions:
  contents: read
concurrency:
  group: terminal-fixes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suspension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      MISE_AUTO_INSTALL: false
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington ${{ runner.os == 'Linux' && 'mold' || '' }}
      - shell: bash
        run: |
          set -euo pipefail
          cargo test -p tui screen::tests::a_cancelled_frame_never_moves_above_its_new_viewport_anchor -- --exact
          cargo test -p sys terminal:: -- --nocapture
          for attempt in $(seq 1 20); do
            echo "suspend/resume round $attempt"
            cargo test -p a --test blackbox tui::the_terminal_is_cooked_while_suspended_and_redrawn_after_continue -- --exact
          done
