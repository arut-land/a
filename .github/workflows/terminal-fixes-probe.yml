name: terminal fixes probe
on:
  push:
    branches: [codex-w3term]
permissions:
  contents: read
concurrency:
  group: terminal-fixes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      MISE_AUTO_INSTALL: false
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington ${{ runner.os == 'Linux' && 'mold' || '' }}
      - shell: bash
        run: |
          cargo test -p sys terminal:: -- --nocapture
