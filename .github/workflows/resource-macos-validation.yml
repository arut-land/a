name: resource macos validation
on:
  push:
    branches: [codex-w5rt]
    paths: [.github/workflows/resource-macos-validation.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  MISE_AUTO_INSTALL: false
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e9dacda1a45400951be780d37d98cf98f76d39b5
      - run: echo "MBX_CACHE_DIR=$RUNNER_TEMP/mbx" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/mbx/actions
          key: resource-macos-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/*.toml') }}
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-nextest github:boltffi/boltffi aqua:yonaskolb/XcodeGen
      - run: mise run check
      - run: mise run budgets
      - run: mise run apple:test
      - run: mise run apple:build
