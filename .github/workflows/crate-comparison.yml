name: crate comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parsers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 4
      MISE_AUTO_INSTALL: false
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: jdx/mise-action@v5
        with:
          install_args: rust ${{ runner.os == 'Linux' && 'mold' || '' }}
      - run: python -m pip install psutil==7.2.2
      - run: PROBE_CARGO="$(rustup which cargo)" python crates/ext-skills/tests/measure/run.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: crate-comparison-${{ matrix.os }}
          path: parser-results.json
