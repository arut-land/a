name: edit review probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows-sharing:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.IO;
          using System.Text;
          using System.Runtime.InteropServices;
          using Microsoft.Win32.SafeHandles;
          public static class Probe {
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] static extern SafeFileHandle CreateFileW(string p,uint a,uint s,IntPtr sa,uint c,uint f,IntPtr t);
            [DllImport("ntdll.dll")] static extern int NtSetInformationFile(SafeFileHandle h,IntPtr ios,IntPtr b,uint n,int c);
            public static void Run() {
              string root=Path.Combine(Path.GetTempPath(),"a-edit-probe-"+Guid.NewGuid());Directory.CreateDirectory(root);
              try {
                foreach(uint share in new uint[]{1,5}) {
                  string target=Path.Combine(root,"target"),stage=Path.Combine(root,"stage");File.WriteAllText(target,"old");File.WriteAllText(stage,"new");
                  using(var source=CreateFileW(target,0x80000000,share,IntPtr.Zero,3,128,IntPtr.Zero))
                  using(var parent=CreateFileW(root,0x80000000,7,IntPtr.Zero,3,0x02000000,IntPtr.Zero))
                  using(var pending=CreateFileW(stage,0xC0010000,7,IntPtr.Zero,3,128,IntPtr.Zero)) {
                    if(source.IsInvalid||parent.IsInvalid||pending.IsInvalid)throw new Exception("open "+Marshal.GetLastWin32Error());
                    using(var writer=CreateFileW(target,0x40000000,7,IntPtr.Zero,3,128,IntPtr.Zero))Console.WriteLine("share="+share+" writer_denied="+writer.IsInvalid);
                    byte[] name=Encoding.Unicode.GetBytes("target");int n=20+name.Length;IntPtr b=Marshal.AllocHGlobal(n),ios=Marshal.AllocHGlobal(16);
                    try {for(int i=0;i<n;i++)Marshal.WriteByte(b,i,0);Marshal.WriteInt32(b,3);Marshal.WriteIntPtr(b,8,parent.DangerousGetHandle());Marshal.WriteInt32(b,16,name.Length);Marshal.Copy(name,0,IntPtr.Add(b,20),name.Length);int status=NtSetInformationFile(pending,ios,b,(uint)n,65);Console.WriteLine("share="+share+" rename_status=0x"+status.ToString("X8"));}
                    finally{Marshal.FreeHGlobal(b);Marshal.FreeHGlobal(ios);}
                  }
                  Console.WriteLine("target="+File.ReadAllText(target));File.Delete(target);File.Delete(stage);
                }
              } finally {Directory.Delete(root,true);}
            }
          }
          '@
          [Probe]::Run()
