name: native diagnostics spare
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-roving:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      MISE_AUTO_INSTALL: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/mbx/actions
          key: web-roving-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mr-boxington cargo:cargo-nextest mold
      - run: sudo apt-get install -y --no-install-recommends clang pkg-config libssl-dev
      - name: Instrument browser without changing test scheduling or assertions
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('apps/web/test-live.mjs')
          s = p.read_text().replace("  const page = await context.newPage();", """  const page = await context.newPage();
            await page.addInitScript(() => {
              window.rovingTrace = [];
              document.addEventListener('DOMContentLoaded', () => {
                if (!document.querySelector('#conversations')) return;
                const snapshot = reason => {
                  const rows = [...document.querySelectorAll('[data-conversation]')];
                  window.rovingTrace.push({reason, at: performance.now(), focus: document.activeElement?.dataset.conversation,
                    rows: rows.map(r => [r.dataset.conversation, r.tabIndex, r.getAttribute('aria-selected')]),
                    placeholder: document.querySelector('#composer')?.placeholder});
                  if (window.rovingTrace.length > 120) window.rovingTrace.shift();
                };
                document.addEventListener('focusin', () => snapshot('focusin'));
                new MutationObserver(records => snapshot(records.map(r => r.type + ':' + r.attributeName).join(',')))
                  .observe(document.querySelector('#conversations').parentNode, {subtree: true, childList: true, attributes: true, attributeFilter: ['tabindex','data-placeholder']});
              });
            });
          """)
          s = s.replace('} finally {', """} catch (error) {
            for (const p of browser.contexts().flatMap(c => c.pages())) {
              console.error('ROVING_TRACE', p.url(), JSON.stringify(await p.evaluate(() => window.rovingTrace).catch(() => [])));
            }
            throw error;
          } finally {""")
          p.write_text(s)
          PYTHON
      - name: Twenty independent real daemon and browser runs
        run: |
          cat > "$RUNNER_TEMP/web-roving.sh" <<'SH'
          set -euo pipefail
          node apps/web/test-browser.mjs
          cargo nextest run --workspace -E 'package(a) & test(=web::a_live_composer_never_throws_or_discards_a_newer_draft)' --no-run
          failures=0
          for round in $(seq 1 20); do
            echo "ROUND $round"
            if ! cargo nextest run --workspace -E 'package(a) & test(=web::a_live_composer_never_throws_or_discards_a_newer_draft)' --no-capture; then
              failures=$((failures+1))
            fi
          done
          echo "RESULT $((20-failures))/20 passed; $failures failed"
          test "$failures" = 0
          SH
          env -i HOME="$HOME" PATH="$PATH" USER="$USER" RUNNER_TEMP="$RUNNER_TEMP" \
            CARGO_BUILD_JOBS=2 CARGO_TARGET_DIR="$RUNNER_TEMP/tgt-web-roving" \
            MBX_CACHE_DIR="$RUNNER_TEMP/mbx" MISE_AUTO_INSTALL=false \
            OPENAI_API_KEY=loopback-dummy OPENAI_BASE_URL=http://127.0.0.1:1/v1 \
            NO_PROXY=127.0.0.1,localhost mise exec -- bash "$RUNNER_TEMP/web-roving.sh"
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/mbx/actions
          key: web-roving-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
