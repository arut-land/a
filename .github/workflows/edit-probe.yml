name: edit-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.IO;
          using System.Runtime.InteropServices;
          using Microsoft.Win32.SafeHandles;
          public class Probe {
            [DllImport("kernel32", CharSet=CharSet.Unicode, SetLastError=true)] static extern SafeFileHandle CreateFileW(string name, uint access, uint share, IntPtr sec, uint creation, uint flags, IntPtr tmpl);
            [DllImport("kernel32", SetLastError=true)] static extern bool SetFileInformationByHandle(SafeFileHandle file, int kind, IntPtr info, uint length);
            public static void Run(string root) {
              Directory.CreateDirectory(root);
              using(var parent = CreateFileW(root, 0x80000002, 3, IntPtr.Zero, 3, 0x02000000, IntPtr.Zero)) {
                foreach(bool relative in new[]{true,false}) foreach(int padding in new[]{0,2,8}) {
                  string source=Path.Combine(root,"source"), target="target";
                  File.WriteAllText(source,"new");
                  using(var file=CreateFileW(source,0x10000,7,IntPtr.Zero,3,0,IntPtr.Zero)) {
                    string name=relative?target:Path.Combine(root,target);
                    byte[] utf=System.Text.Encoding.Unicode.GetBytes(name);
                    int length=20+utf.Length+padding;
                    IntPtr info=Marshal.AllocHGlobal(length);
                    for(int i=0;i<length;i++) Marshal.WriteByte(info,i,0);
                    Marshal.WriteInt32(info,0,3);
                    Marshal.WriteIntPtr(info,8,relative?parent.DangerousGetHandle():IntPtr.Zero);
                    Marshal.WriteInt32(info,16,utf.Length);
                    Marshal.Copy(utf,0,IntPtr.Add(info,20),utf.Length);
                    bool ok=SetFileInformationByHandle(file,22,info,(uint)length);
                    Console.WriteLine("relative="+relative+" padding="+padding+" ok="+ok+" error="+Marshal.GetLastWin32Error());
                    Marshal.FreeHGlobal(info);
                  }
                  if(File.Exists(source)) File.Delete(source);
                  if(File.Exists(Path.Combine(root,target))) File.Delete(Path.Combine(root,target));
                }
              }
            }
          }
          '@
          [Probe]::Run((Join-Path $env:RUNNER_TEMP "edit-probe"))
