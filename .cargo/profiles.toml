[profile.dev]
codegen-backend = "cranelift"
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
codegen-backend = "llvm"
opt-level = 1
debug = false

# package."*" outranks build-override, so proc-macro crates are named here;
# at opt-level 0 they build ~2x faster and expansion cost is negligible.
[profile.dev.package.syn]
opt-level = 0

[profile.dev.package.usage-derive]
opt-level = 0

# panic stays unwind so a panicking session actor cannot take the daemon down.
[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"

# Cold paths (one request encode per model turn, argv parsed once): size over
# speed. Network time dominates these; hot paths such as serde_json stay at 3.
# ureq and usage-argv are smaller at z (-38 KiB); http is not.
[profile.release.package.ureq]
opt-level = "z"

[profile.release.package.ureq-proto]
opt-level = "s"

[profile.release.package.url]
opt-level = "s"

[profile.release.package.http]
opt-level = "s"

[profile.release.package.usage-argv]
opt-level = "z"

# The daemon's control flow (sessions, tools, the log, the runtime, OS
# calls) and the clients' connection: syscalls and the model dominate, and
# s saves about 160 KiB with no measured change in daemon CPU.
[profile.release.package.engine]
opt-level = "s"

[profile.release.package.agent]
opt-level = "s"

[profile.release.package.store]
opt-level = "s"

[profile.release.package.client]
opt-level = "s"

[profile.release.package.sys]
opt-level = "s"

[profile.release.package.rt]
opt-level = "s"

# Network time dominates the provider layer: s costs its decoders ~6% per
# frame and saves ~160 KiB.
[profile.release.package.llm]
opt-level = "s"

# The web UI renders at the pace of one person's clicks, and its views
# monomorphize into a lot of code: z saves ~480 KiB over 3.
[profile.release.package.web]
opt-level = "z"

[profile.release.package.topcoat-view]
opt-level = "z"

[profile.release.package.topcoat-router]
opt-level = "z"

[profile.release.package.topcoat-runtime]
opt-level = "z"

[profile.release.package.topcoat-core]
opt-level = "z"

# What only topcoat links (its sync primitives, and the websocket stack its
# router brings and no request reaches): z saves 16 KiB over 3.
[profile.release.package.topcoat-asset]
opt-level = "z"

[profile.release.package.tokio]
opt-level = "z"

[profile.release.package.tokio-tungstenite]
opt-level = "z"

[profile.release.package.tungstenite]
opt-level = "z"

[profile.release.package.hyper]
opt-level = "z"

[profile.release.package.hyper-util]
opt-level = "z"

[profile.release.package.h2]
opt-level = "z"

[profile.release.package.futures-util]
opt-level = "z"

[profile.release.package.matchit]
opt-level = "z"

[profile.release.package.http-body-util]
opt-level = "z"

# The terminal client redraws once per streamed token at most: s saves
# 32 KiB over 3 for ~40 µs a frame (90 µs on a 6000-item session); z would
# save 48 KiB more at twice the frame time (docs/tui.md).
[profile.release.package.tui]
opt-level = "s"

# cargo-bolero (`mise run fuzz`): optimized, and LLVM throughout for
# libFuzzer's coverage instrumentation.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
codegen-backend = "llvm"
