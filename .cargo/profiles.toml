[profile.dev]
codegen-backend = "cranelift"
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Dependencies build once (mbx shares them) and most run once per build
# (proc-macros, their syn) or never in a test: unoptimized, which builds
# ~2x faster. package."*" outranks build-override, so proc-macros cannot be
# told apart here; the few whose runtime the tests feel are named below.
[profile.dev.package."*"]
codegen-backend = "llvm"
opt-level = 0
debug = false

# Frames every message.
[profile.dev.package.serde_json]
opt-level = 1

# The terminal client's input and cells, drawn in every TUI test.
[profile.dev.package.vte]
opt-level = 1

[profile.dev.package.unicode-width]
opt-level = 1

# Under every OS call and search.
[profile.dev.package.rustix]
opt-level = 1

[profile.dev.package.memchr]
opt-level = 1

# neo_frizbee's x86 SIMD scorer is generic: it is instantiated here, and
# Cranelift has no lowering for intrinsics it uses (sse4.1 phminposuw).
[profile.dev.package.ext-index]
codegen-backend = "llvm"

# panic stays unwind so a panicking session actor cannot take the daemon down.
#
# The same size profile on every target. Linux measurements and the native
# TLS comparison are in docs/perf.
[profile.release]
# LLVM-only metadata for safe ELF folding; dev uses Cranelift.
rustflags = ["-Cllvm-args=-addrsig"]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"

# snmalloc treats Cargo's debug-information setting as its C++ debug mode.
[profile.release.package.snmalloc-sys]
debug = false

# cargo-bolero (`mise run fuzz`): optimized, and LLVM throughout for
# libFuzzer's coverage instrumentation.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
codegen-backend = "llvm"
