# cargo-deny: `mise run deny`.

[graph]
# What we ship; the lockfile also resolves wasm, Android and other targets.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is test-only: the llm parity tests read recorded YAML cassettes" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    # foldhash, through yaml-rust2's hashlink dependency.
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
skip = [
    { crate = "windows-sys@0.60.2", reason = "notify 8 pins 0.60; sys and the async reactor use 0.61. The watcher backend does not exchange Windows types with them" },
    { crate = "syn@2.0.119", reason = "hypertext-macros (web) is on syn 2; serde_derive, usage-derive, thiserror-impl and ext-derive on 3. Goes when hypertext moves" },
]
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # The engine is async on its own runtime (crates/rt): no third-party
    # runtime or the HTTP stacks built on one; `a web` serves on its own
    # small server over rt. `mise run check:no-tokio` keeps every crate `a`
    # builds free of it.
    { crate = "tokio", reason = "the engine runs on rt; rt's tokio adapter is opt-in" },
    { crate = "async-std", reason = "the engine runs on rt" },
    { crate = "hyper", reason = "ureq is the HTTP client" },
    { crate = "reqwest", reason = "ureq is the HTTP client" },
    # The optional rustls transport uses ring; the binary uses native TLS.
    { crate = "aws-lc-sys", reason = "rustls uses ring" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Require immutable revisions for the two upstream fixes.
required-git-spec = "rev"
allow-git = [
    # Native TLS without an unused Mozilla certificate bundle.
    "https://github.com/algesten/ureq",
    # Scheduler state must outlive wakes racing executor destruction.
    "https://github.com/smol-rs/async-executor",
]
