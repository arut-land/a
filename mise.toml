min_version = "2026.10.12"

[settings]
# Rust comes from rust-toolchain.toml; mise must not pin its own.
idiomatic_version_file_enable_tools = ["rust"]
auto_install = true
cargo.binstall_native = true
cargo.binstall_only = false
# Tool versions resolve through mise.lock, checksums included.
lockfile = true

[env]
# Local secrets (gitignored), e.g. OPENAI_API_KEY and OPENAI_BASE_URL.
_.file = { path = ".env.local", redact = true }

[task_config]
# Git Bash on Windows, so task scripts are the same everywhere.
shell = "bash -o errexit -o pipefail -c"

[tools]
mr-boxington = "1.24.1"
"cargo:cargo-nextest" = "0.9"
"cargo:cargo-deny" = "0.20"
"cargo:cargo-machete" = "0.9.2"
# Coverage-guided runs of the bolero targets (`mise run fuzz`).
"cargo:cargo-bolero" = "0.13.5"
mold = { version = "3.0.0", os = ["linux"] }
hyperfine = "2.0.0"
"cargo:cargo-bloat" = "0.12.1"
"cargo:cargo-llvm-lines" = "0.4.48"
# The macOS app (apps/apple): the BoltFFI CLI at exactly the version of the
# crates/ffi dependency, and XcodeGen for its project.
"github:boltffi/boltffi" = { version = "0.31.1", os = ["macos"] }
"aqua:yonaskolb/XcodeGen" = { version = "2.46.0", os = ["macos"] }

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[tasks]
build = "cargo build --workspace"
release = "cargo build-release --workspace"
fmt = "cargo fmt --all"
test = "cargo nextest run --workspace --no-tests=pass"
"check:fmt" = "cargo fmt --all --check"
"check:clippy" = "cargo clippy --workspace --all-targets -- -D warnings"
# Sequential: the tests and clippy would rebuild the same target at once.
check = { depends = ["check:fmt", "check:clippy"], run = "mise run test" }
# The shipped binary: under 4 MiB, and without the test fixtures (no
# `sleep` tool), found as a tool it does ship is found.
size = { depends = ["release"], run = '''
f=target/release/a; [[ -e $f.exe ]] && f+=.exe
! grep -q "Waits for a number of seconds." "$f" || { echo "the sleep fixture is in the shipped binary"; exit 1; }
grep -q "Edits a text file by exact replacement." "$f"
b=$(wc -c < "$f"); echo "a: $((b / 1024)) KiB of 4096 KiB"; ((b <= 4194304))
''' }
# Cold start against the floor: what launching any process costs here.
startup = { depends = ["release"], run = 'hyperfine -N --warmup 50 -r 500 "target/release/a --version" /usr/bin/true' }
bloat = "cargo bloat --release --crates -n 20"
"bloat:lines" = "cargo llvm-lines --release -p a | head -30"
# Shell completions (bash, zsh, fish, nu, PowerShell, elvish: usage's
# scripts, which ask `a __complete_word__` on each Tab) and the man page,
# written from the derive in apps/cli/src/args.rs by an example that is
# not shipped, into target/generated (or the directory given).
generate = { usage = 'arg "[dir]" default="target/generated"', run = 'cargo run -q -p a --example generate -- "$usage_dir"' }
deny = "cargo deny check"
# Unused dependencies.
machete = "cargo machete"
# No crate links the crate named exactly `tokio` (slab, bytes and the rest
# of the tokio-rs org are fine): not the workspace's, nor `a` as built by
# default, web UI included.
"check:no-tokio" = '''
cargo tree -e normal --target all --workspace --prefix none -f '{p}' > target/no-tokio.txt
if grep -E '^tokio v' target/no-tokio.txt; then
  echo "a crate depends on tokio: cargo tree -i tokio shows which"
  exit 1
fi
'''
# The Windows build, linted from any host: nothing above `sys` and `rt`
# names a platform, so all of it, `a` included, builds there.
# Vendored Lua needs the native C SDK; Windows CI lints that optional feature.
"check:windows" = "cargo clippy --workspace --exclude ext-lua --all-targets --target x86_64-pc-windows-msvc -- -D warnings"
# Miri over sys and rt's executor lifetime boundary. Miri runs no processes and
# (on macOS) sets no file times, nor modes, so the tests that need those are skipped.
"test:miri" = '''
cargo miri test -p rt --lib threads::tests::task_wak
MIRIFLAGS=-Zmiri-disable-isolation cargo miri test -p sys --lib -- --skip install:: --skip asks_a_shell --skip stages_newest --skip a_higher_version --skip tests::a_group_leader --skip tests::kills --skip fs::tests
'''
# Coverage-guided fuzzing (libFuzzer) of protocol and skill frontmatter.
# Crashes land beside the target in __fuzz__, replayed by ordinary tests;
# generated corpora stay in target/fuzz.
fuzz = { usage = '''
arg "[target]" help="framer, json_decode, view_reducer or skill_frontmatter; all by default"
flag "-T --time <time>" default="60s"
''', run = '''
for target in ${usage_target:-framer json_decode view_reducer skill_frontmatter}; do
  package=protocol
  test="$target"
  if [[ "$target" == skill_frontmatter ]]; then
    package=ext-skills
    test=parse::tests::skill_frontmatter
    mkdir -p "target/fuzz/$target/corpus"
    cp crates/ext-skills/tests/corpus/*.md "target/fuzz/$target/corpus/"
  fi
  cargo bolero test -p "$package" "$test" -T "$usage_time" --corpus-dir "target/fuzz/$target/corpus"
done
''' }
# The black-box tests (apps/cli/tests/blackbox) are one binary; a task
# picks its module by name. The M1 acceptance tests on the dev build:
acceptance = "cargo nextest run -p a --test blackbox -E 'test(/^(acceptance|daemon_acceptance)::/)' --no-tests=fail"
# `a web` on the dev build against an isolated home (target/web-home) and
# the model-backed agent, with the keys .env.local gives its sessions
# (`[daemon]` `agent = "echo"` in its config.toml for none); its daemon
# stops with it.
web = '''
cargo build -p a --features fixtures
export A_HOME=$PWD/target/web-home
trap 'target/debug/a daemon stop >/dev/null' EXIT
target/debug/a web
'''
# The black-box web UI tests (apps/cli/tests/blackbox/web.rs) on the dev build.
"test:web" = "cargo nextest run -p a --test blackbox -E 'test(/^web::/)' --no-tests=fail"
# Cold start, attach latency and idle daemon RSS on a release build that
# differs from the shipped one only by the test fixtures (built aside, in
# target/fixtures; its size bounds the shipped one's). That `a` as shipped
# lacks them is read off the dependency graph, not a second release
# build: `mise run size` scans the shipped bytes. Latency is held to its
# budget off CI, and on CI where the job sets A_STRICT_BUDGETS=1;
# elsewhere shared runners get slack. The budgets are #[ignore]d: a
# latency is a wall time, meaningful only on this build, one at a time,
# on a machine doing nothing else, so the dev-build suite never runs them.
budgets = '''
if cargo tree -e normal,features -p a -f '{p} {f}' | grep 'ext-fixtures v' | grep -qw on; then
  echo "a as built by default turns the fixtures on"; exit 1
fi
CARGO_TARGET_DIR=target/fixtures cargo build-release -p a --features fixtures
b=$(wc -c < target/fixtures/release/a); echo "a (fixtures): $((b / 1024)) KiB of 4096 KiB"; ((b <= 4194304))
A_BIN=$PWD/target/fixtures/release/a A_STRICT_BUDGETS=${A_STRICT_BUDGETS:-$([[ -n ${CI:-} ]] && echo 0 || echo 1)} cargo nextest run -p a --test blackbox -E 'test(/^budgets::/)' --run-ignored ignored-only --test-threads 1 --no-capture --no-tests=fail
# The process-wide wake counter needs its own executable, run alone.
CARGO_TARGET_DIR=target/fixtures cargo nextest run --release -p ext-shell --test quiet --run-ignored ignored-only --test-threads 1 --no-capture --no-tests=fail
'''

# The macOS app (apps/apple). The FFI package: crates/ffi for macOS arm64
# plus its Swift bindings, in apps/apple/Generated (pass --release for an
# optimized library).
"apple:ffi" = { dir = "crates/ffi", run = "boltffi pack apple --deny-skipped" }
"apple:gen" = { dir = "apps/apple", run = "xcodegen generate --quiet" }
# The shared reducer vectors (A_VECTORS names them: the Swift tests hold
# no path into the Rust tree) and the session store through the FFI, then
# a live session on a daemon of its own (a throwaway A_HOME, the echo
# agent).
"apple:test" = { depends = ["apple:ffi"], run = '''
cargo build -p a --features fixtures
export A_HOME=$(mktemp -d) A_TEST_HELPER=$PWD/target/debug/a A_VECTORS=$PWD/crates/protocol/tests/vectors/view.json
printf '[daemon]\nagent = "echo"\n\n[ext.policy]\nask = ["bash"]\n' > "$A_HOME/config.toml"
trap 'target/debug/a daemon stop >/dev/null; rm -rf "$A_HOME"' EXIT
swift test --package-path apps/apple/AKit
''' }
# Headless and ad hoc signed, with the release `a` in Contents/Helpers:
# apps/apple/build/Build/Products/Debug/A.app.
"apple:build" = { depends = ["apple:ffi", "apple:gen"], run = [
    "cargo build-release -p a",
    "xcodebuild -quiet -project apps/apple/A.xcodeproj -scheme A -configuration Debug -destination platform=macOS,arch=arm64 -derivedDataPath apps/apple/build build",
] }
# The Release configuration as a distribution archive (ad hoc signed; a
# Developer ID export re-signs it), checked to carry and seal its helper:
# apps/apple/build/A.xcarchive.
"apple:archive" = { depends = ["apple:ffi", "apple:gen"], run = [
    "cargo build-release -p a",
    "xcodebuild -quiet -project apps/apple/A.xcodeproj -scheme A -configuration Release -destination generic/platform=macOS ARCHS=arm64 -derivedDataPath apps/apple/build archive -archivePath apps/apple/build/A.xcarchive",
    "codesign --verify --deep --strict apps/apple/build/A.xcarchive/Products/Applications/A.app",
    "apps/apple/build/A.xcarchive/Products/Applications/A.app/Contents/Helpers/a --version",
] }
# In the foreground, with this shell's environment (and .env.local's keys):
# `A_HOME=... mise run apple:run` gives the app and the daemon it starts
# their own home.
"apple:run" = { depends = ["apple:build"], run = "apps/apple/build/Build/Products/Debug/A.app/Contents/MacOS/A" }
