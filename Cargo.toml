[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
exclude = ["fixtures/rig/oracle"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
agent = { path = "crates/agent" }
client = { path = "crates/client" }
engine = { path = "crates/engine" }
llm = { path = "crates/llm" }
protocol = { path = "crates/protocol" }
rt = { path = "crates/rt" }
store = { path = "crates/store" }
sys = { path = "crates/sys" }
web = { path = "apps/web" }

bytes = { version = "1", default-features = false, features = ["std"] }
http = { version = "1", default-features = false, features = ["std"] }
memchr = { version = "2", default-features = false, features = ["std"] }
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
ureq = { version = "3", default-features = false }
usage-rs = { version = "=7.0.2", default-features = false, features = ["help", "diagnostics"] }
uuid = { version = "1", default-features = false, features = ["std", "v7", "serde"] }

[workspace.lints.rust]
# deny, not forbid: `sys` opts out for OS calls, and tests may opt out locally
# (e.g. a counting global allocator) with an `#[allow(unsafe_code)]` and a
# SAFETY comment.
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
