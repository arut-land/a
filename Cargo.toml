[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
agent = { path = "crates/agent" }
client = { path = "crates/client" }
engine = { path = "crates/engine" }
protocol = { path = "crates/protocol" }
store = { path = "crates/store" }
sys = { path = "crates/sys" }

rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
usage-rs = { version = "=7.0.2", default-features = false, features = ["help", "diagnostics"] }
uuid = { version = "1", default-features = false, features = ["std", "v7", "serde"] }

[workspace.lints.rust]
# deny, not forbid: the sys crate is the single place allowed to opt out.
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
