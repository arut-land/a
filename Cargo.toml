[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
# apps/apple is an Xcode project, not a crate.
exclude = ["fixtures/rig/oracle", "apps/apple"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
# The extension SDK, and the extensions: one crate each, or a small group
# that belongs together. A binary links the ones it runs.
ext = { path = "crates/ext" }
ext-compact = { path = "crates/ext-compact" }
ext-derive = { path = "crates/ext-derive" }
ext-edit = { path = "crates/ext-edit" }
ext-fork = { path = "crates/ext-fork" }
ext-fixtures = { path = "crates/ext-fixtures" }
ext-mcp = { path = "crates/ext-mcp" }
ext-lua = { path = "crates/ext-lua" }
ext-policy = { path = "crates/ext-policy" }
ext-prompt = { path = "crates/ext-prompt" }
ext-retry = { path = "crates/ext-retry" }
ext-settings = { path = "crates/ext-settings" }
ext-skills = { path = "crates/ext-skills" }
ext-shell = { path = "crates/ext-shell" }
ext-subagent = { path = "crates/ext-subagent" }
ext-title = { path = "crates/ext-title" }
json = { path = "crates/json" }
kernel = { path = "crates/kernel" }
client = { path = "crates/client" }
engine = { path = "crates/engine" }
llm = { path = "crates/llm" }
protocol = { path = "crates/protocol" }
rt = { path = "crates/rt" }
sys = { path = "crates/sys" }
tui = { path = "apps/tui" }
web = { path = "apps/web" }

http = { version = "1", default-features = false, features = ["std"] }
memchr = { version = "2", default-features = false, features = ["std"] }
libc = { version = "0.2.191", default-features = false }
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
ureq = { version = "3", default-features = false }
usage-rs = { version = "=7.1.0", default-features = false, features = ["help", "diagnostics", "completions"] }
uuid = { version = "1", default-features = false, features = ["std", "v7", "serde"] }

[workspace.lints.rust]
# deny, not forbid: `sys` opts out for OS calls, and tests may opt out locally
# (e.g. a counting global allocator) with an `#[allow(unsafe_code)]` and a
# SAFETY comment.
unsafe_code = "deny"
unused_qualifications = "warn"
# A tool's `call` returns what its shape is (`ext::shape`): an impl names
# the type, which the trait leaves open.
refining_impl_trait = { level = "allow", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
