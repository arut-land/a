[package]
name = "transport"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# The HTTP/1.1 client, async over the `rt` reactor; with neither TLS feature
# it speaks plain http only.
client = ["dep:rt", "dep:sys", "dep:ureq-proto", "dep:base64", "dep:futures-lite", "dep:async-compression", "dep:mzstd"]
# Binaries select TLS features; this library makes no platform choice.
# Host crypto and trust (Security.framework, SChannel, OpenSSL), without a
# bundled crypto implementation or certificate bundle.
tls-native = ["client", "dep:native-tls"]
# rustls with the platform verifier, over ring.
tls-rustls = ["client", "dep:rustls", "dep:rustls-platform-verifier"]

[dependencies]
async-compression = { version = "0.4", default-features = false, features = ["futures-io", "gzip"], optional = true }
# Proxy credentials; ureq-proto links it already.
base64 = { version = "0.23", default-features = false, features = ["std"], optional = true }
futures-core = { version = "0.3", default-features = false, features = ["std"] }
# `stream::unfold`: rt links it already.
futures-lite = { version = "2", default-features = false, features = ["std"], optional = true }
http.workspace = true
mzstd = { version = "0.2.8", default-features = false, features = ["std", "compression", "decompression"], optional = true }
native-tls = { version = "0.2.14", default-features = false, optional = true }
rt = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"], optional = true }
rustls-platform-verifier = { version = "0.7", default-features = false, optional = true }
# TCP keep-alive.
sys = { workspace = true, optional = true }
# HTTP/1.1 as a sans-IO state machine: the protocol ureq runs, driven here
# over non-blocking sockets.
ureq-proto = { version = "0.6.5", default-features = false, features = ["client"], optional = true }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["pem"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
rsa = "0.10.0-rc.19"
sha2 = { version = "0.11", default-features = false, features = ["oid"] }
time = { version = "0.3", default-features = false, features = ["std"] }
rt.workspace = true

[lints]
workspace = true
