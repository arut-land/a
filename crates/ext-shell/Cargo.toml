[package]
name = "ext-shell"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Startup shell facts for tests that register the tools without a daemon.
testing = ["sys/testing"]

[dependencies]
ext.workspace = true
llm.workspace = true
protocol.workspace = true
rt.workspace = true
serde.workspace = true
serde_json.workspace = true
sys.workspace = true
# Terminal escape sequences, dropped from command output.
vte = { version = "0.15", default-features = false }

[dev-dependencies]
tempfile = { version = "3", default-features = false }
ext = { workspace = true, features = ["testing"] }
sys = { workspace = true, features = ["testing"] }

[lints]
workspace = true
