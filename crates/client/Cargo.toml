[package]
name = "client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Watches machines.toml and the ssh configuration for the host list.
rt = { workspace = true, features = ["watch"] }
ext-logging.workspace = true
protocol = { workspace = true, features = ["native-buffer"] }
sys.workspace = true
serde_json.workspace = true
# The remote verifies uploads with POSIX `cksum`, the one digest every host has.
crc = "3.2"
# `Include` globs in the ssh configuration, matched as ssh's glob(3) does.
glob = "0.3"

[lints]
workspace = true

[dev-dependencies]
tempfile = { version = "3", default-features = false }
