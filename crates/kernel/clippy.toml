# The kernel is sans-IO and reads no clock: time comes in as events, and
# every effect goes out to the driver (tests/invariants.rs checks the same
# of the source and of all the crate pulls in).
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "the kernel reads no clock: time comes in as events" },
    { path = "std::time::SystemTime::now", reason = "the kernel reads no clock: time comes in as events" },
    { path = "std::thread::sleep", reason = "the kernel never blocks" },
    { path = "std::thread::spawn", reason = "the kernel runs nothing: it returns effects" },
    { path = "std::process::Command::new", reason = "the kernel runs nothing: it returns effects" },
    { path = "std::fs::read", reason = "the kernel does no I/O" },
    { path = "std::fs::write", reason = "the kernel does no I/O" },
    { path = "std::fs::File::open", reason = "the kernel does no I/O" },
    { path = "std::fs::File::create", reason = "the kernel does no I/O" },
]
