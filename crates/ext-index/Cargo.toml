[package]
name = "ext-index"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ext.workspace = true
sys.workspace = true
rt = { workspace = true, features = ["watch"] }
serde.workspace = true
memchr.workspace = true
# What FFF's copied code is built on (src/fff): the fuzzy scorer, the
# gitignore-aware walk and its globs, and grep's matchers.
neo_frizbee = { version = "0.13.3", default-features = false, features = ["std", "match_end_col"] }
ignore = "0.4.25"
globset = { version = "0.4.18", default-features = false }
# Patterns are matched as bytes with ASCII classes (`unicode(false)`):
# no Unicode tables.
regex = { version = "1.12", default-features = false, features = ["std", "perf"] }
regex-syntax = { version = "0.8.10", default-features = false, features = ["std"] }
aho-corasick = { version = "1.1.4", default-features = false, features = ["std", "perf-literal"] }
bstr = { version = "1.12", default-features = false, features = ["std"] }
smallvec = { version = "1.15", features = ["const_generics", "union", "serde"] }

[dev-dependencies]
tempfile = { version = "3", default-features = false }

[lints]
workspace = true
