[package]
name = "protocol"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Return large receive buffers to the OS while retaining their address range.
native-buffer = ["dep:sys"]

[dependencies]
sys = { workspace = true, optional = true }
json.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
uuid.workspace = true

[dev-dependencies]
# tests/fuzz.rs: random input under `cargo test`, libFuzzer under
# cargo-bolero.
bolero = "0.13"

[lints]
workspace = true
