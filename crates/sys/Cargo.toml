[package]
name = "sys"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# config.toml, edited in place so a hand-edited file keeps its comments.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["stdio", "pipe", "event", "net", "termios"] }
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
object = { version = "0.40", default-features = false, features = ["read_core", "elf"] }

[target.'cfg(target_os = "macos")'.dependencies]
object = { version = "0.40", default-features = false, features = ["read_core", "macho"] }
oslog = { version = "0.2", default-features = false }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFString"] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "libc"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
tracelogging = "1.2.4"
# Ordinary executable names keep .NET Framework hosts working; preserve verbatim-only names.
dunce = "1.0.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Diagnostics_Debug", "Win32_System_SystemServices", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Power"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = { version = "3", default-features = false }
