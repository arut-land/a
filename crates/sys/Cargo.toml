[package]
name = "sys"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# config.toml, edited in place so a hand-edited file keeps its comments.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["stdio", "pipe", "event", "net", "termios"] }
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# Ordinary executable names keep .NET Framework hosts working; preserve verbatim-only names.
dunce = "1.0.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_SystemServices"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = { version = "3", default-features = false }
