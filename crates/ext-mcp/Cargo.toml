[package]
name = "ext-mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[dependencies]
form_urlencoded = "1.2.2"
http-auth = { version = "0.1.10", default-features = false }
sha2 = { version = "0.11", default-features = false }
transport = { workspace = true, features = ["client"] }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
ext.workspace = true
ext-derive.workspace = true
http.workspace = true
llm.workspace = true
protocol.workspace = true
rt.workspace = true
serde.workspace = true
serde_json.workspace = true
sys.workspace = true

[dev-dependencies]
sys = { workspace = true, features = ["test-support"] }
ext = { workspace = true, features = ["testing"] }
ext-shell = { workspace = true, features = ["testing"] }
ext-policy.workspace = true

[lints]
workspace = true

[features]
fixture = []

[[bin]]
name = "mcp-fixture"
path = "tests/server.rs"
required-features = ["fixture"]
test = false

[[test]]
name = "client"
path = "tests/client.rs"
required-features = ["fixture"]

[[test]]
name = "oauth"
path = "tests/oauth.rs"
required-features = ["fixture"]
