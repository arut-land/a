[package]
name = "engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Optional debug events on stderr; separate from typed daemon diagnostics.
events = []

[dependencies]
transport.workspace = true
ext-logging.workspace = true
# Each log line's checksum, in hardware where the CPU has it.
crc32c = "0.6.8"
ext.workspace = true
kernel.workspace = true
llm = { workspace = true, features = ["ureq"] }
memchr.workspace = true
rt.workspace = true
serde.workspace = true
serde_json.workspace = true
protocol.workspace = true
sys.workspace = true
# Blob ids; already built for ext-mcp's content hashes.
sha2 = { version = "0.11", default-features = false }

[lints]
workspace = true

[dev-dependencies]
tempfile = { version = "3", default-features = false }
ext-metrics.workspace = true
client.workspace = true
ext-logging = { workspace = true, features = ["testing"] }
futures-core = { version = "0.3", default-features = false, features = ["std"] }
http.workspace = true
serde_yaml_ng = "0.10"
# The extensions sessions under test run.
ext-compact.workspace = true
ext-edit.workspace = true
ext-title.workspace = true
ext-fork.workspace = true
ext-fixtures = { workspace = true, features = ["on"] }
ext-policy.workspace = true
ext-prompt.workspace = true
ext-retry.workspace = true
ext-settings.workspace = true
ext-shell.workspace = true
ext-skills.workspace = true
ext-subagent.workspace = true
