[package]
name = "engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# The daemon's events, written to its log; see `EventSink`.
events = []

[dependencies]
ext.workspace = true
llm = { workspace = true, features = ["ureq"] }
memchr.workspace = true
rt.workspace = true
serde.workspace = true
serde_json.workspace = true
protocol.workspace = true
store.workspace = true
sys.workspace = true

[lints]
workspace = true

[dev-dependencies]
bytes.workspace = true
futures-core = { version = "0.3", default-features = false, features = ["std"] }
http.workspace = true
serde_yaml_ng = "0.10"
# The extensions sessions under test run.
ext-chat.workspace = true
ext-edit.workspace = true
ext-fixtures = { workspace = true, features = ["on"] }
ext-policy.workspace = true
ext-prompt.workspace = true
ext-retry.workspace = true
ext-shell.workspace = true
