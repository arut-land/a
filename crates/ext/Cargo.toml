[package]
name = "ext"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The contract between extensions, the kernel and the engine: I/O-free, as
# the kernel builds on it (`tests/io.rs` checks what it pulls in). What a
# call needs from the OS or a runtime it asks the engine for, as a service.
[features]
# `testing::Rig`, a stand-in engine for an extension's tests.
testing = ["dep:tempfile", "dep:rt", "rt/watch", "dep:blob-files", "transport/ureq"]

[dependencies]
blob.workspace = true
blob-files = { workspace = true, optional = true }
transport.workspace = true
ext-derive.workspace = true
llm.workspace = true
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = { version = "3", default-features = false, optional = true }
smallvec = { version = "1.13", default-features = false }
rt = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
blob-files.workspace = true
rt.workspace = true
