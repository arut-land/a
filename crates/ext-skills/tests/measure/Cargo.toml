[workspace]
[package]
name = "skill-parser-probe"
version = "0.0.0"
edition = "2024"
publish = false
[features]
infrastructure = []
signal-custom = ["infrastructure", "dep:sys"]
signal-maintained = ["infrastructure", "dep:signal-hook"]
temp-custom = ["infrastructure"]
temp-maintained = ["infrastructure", "dep:tempfile"]
custom = []
event = ["dep:yaml-rust2"]
saphyr = ["dep:saphyr"]
serde = ["dep:serde_yaml_ng"]
yaml = ["dep:yaml-rust2"]
[dependencies]
serde_json = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_yaml_ng = { version = "=0.10.0", default-features = false, optional = true }
yaml-rust2 = { version = "=0.13.0", default-features = false, optional = true }
saphyr = { version = "0.2.2", default-features = false, optional = true }
sys = { path = "../../../sys", optional = true }
signal-hook = { version = "0.4.5", default-features = false, optional = true }
tempfile = { version = "3.27", default-features = false, optional = true }
[[bin]]
name = "infrastructure"
path = "src/infrastructure.rs"
required-features = ["infrastructure"]
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"
[profile.release.package.serde_json]
opt-level = 3
