[package]
name = "llm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Return large receive buffers to the OS while retaining their address range.
native-buffer = ["dep:sys"]
client = ["transport/client", "native-buffer"]
tls-native = ["transport/tls-native"]
tls-rustls = ["transport/tls-rustls"]

[dependencies]
sys = { workspace = true, optional = true }
# Bytes a caller holds go as base64 only as a request is written; the
# shipped tree has it already, through ureq.
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
http.workspace = true
json.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
smol_str = { version = "0.3", default-features = false, features = ["serde", "std"] }

transport.workspace = true

[dev-dependencies]
rt.workspace = true
serde_yaml_ng = "0.10"

[lints]
workspace = true
