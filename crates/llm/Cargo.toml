[package]
name = "llm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
client = ["transport/client"]
tls-native = ["transport/tls-native"]
tls-rustls = ["transport/tls-rustls"]

[dependencies]
http.workspace = true
json.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
smol_str = { version = "0.3", default-features = false, features = ["serde", "std"] }

transport.workspace = true

[dev-dependencies]
rt.workspace = true
serde_yaml_ng = "0.10"

[lints]
workspace = true
