[package]
name = "rt"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["threads"]
# The built-in runtime: async-executor's workers and a blocking pool of
# our own (the `blocking` crate's polls every 500 ms while idle).
threads = ["dep:async-executor"]
watch = ["dep:notify"]

[dependencies]
# Already linked by async-io; producer wake never waits on registration.
atomic-waker = "1"
sys = { path = "../sys" }
notify = { version = "8", optional = true }
# Scheduler state must outlive wakes racing executor destruction (upstream #164).
async-executor = { git = "https://github.com/smol-rs/async-executor", rev = "96a1f6a19ceb828c8eb8a10cb4b40daefdbdb945", optional = true }
# The reactor and timers: one thread waiting
# in kqueue, epoll or IOCP (through polling) until something is due.
async-io = "2"
futures-core = { version = "0.3", default-features = false, features = ["std"] }
# `future::or`, the one racer: async-io links it already.
futures-lite = { version = "2", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true


[dev-dependencies]
futures-channel = "0.3"
async-channel = "2"
oneshot = "0.2"

[lints]
workspace = true
