[package]
name = "rt"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["threads"]
# The built-in runtime.
threads = ["dep:async-task"]
smol = ["dep:smol"]
tokio = ["dep:tokio"]

[dependencies]
async-task = { version = "4", optional = true }
futures-core = { version = "0.3", default-features = false, features = ["std"] }
# The reactor's poller: kqueue, epoll, or IOCP on Windows.
mio = { version = "1", default-features = false, features = ["os-poll", "os-ext"] }
smol = { version = "2", optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "time"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true
